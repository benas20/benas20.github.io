<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAMERA CLUB / CONTACT SHEET</title>
  <link rel="icon" type="image/jpeg" href="img/BAVIcon.png">

  <style>
    :root {
      --paper: #d6d0c4;
      --ink: #3e4140;
      --line: rgba(62, 65, 64, .34);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: "Courier New", Courier, monospace;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .24;
      background:
        linear-gradient(rgba(62, 65, 64, .08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(62, 65, 64, .08) 1px, transparent 1px);
      background-size: 80px 80px;
      z-index: 5;
    }

    .space {
      position: fixed;
      inset: 0;
      overflow: hidden;
      perspective: 1200px;
      perspective-origin: 50% 50%;
      background:
        radial-gradient(ellipse at center, rgba(255,255,255,.17), transparent 62%),
        var(--paper);
    }

    .space::before {
      content: "";
      position: absolute;
      inset: 9vh 3vw;
      border: 1px solid var(--line);
      pointer-events: none;
      z-index: 2;
    }

    .space::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(62,65,64,.48);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }

    .scene {
      position: absolute;
      inset: 0;
      z-index: 30;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .photo {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 1;
      width: clamp(140px, 15vw, 290px);
      aspect-ratio: 4 / 5;
      margin: 0;
      transform-style: preserve-3d;
      will-change: transform, opacity;
      transition: filter .35s ease;
    }

    .photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      padding: 8px;
      background: rgba(214,208,196,.78);
      border: 1px solid rgba(62,65,64,.55);
      box-shadow: 0 18px 35px rgba(62,65,64,.13);
      filter: saturate(.84) contrast(.96);
      transition: border .25s ease, box-shadow .25s ease, transform .25s ease;
      cursor: default;
      pointer-events: auto;
      position: relative;
      z-index: 2;
    }

    .photo.clickable img {
      cursor: pointer;
    }

    .photo.clickable:hover img {
      transform: scale(1.08);
      box-shadow: 0 25px 45px rgba(62,65,64,.35);
      border-color: var(--ink);
    }

    .photo::after {
      content: attr(data-label);
      position: absolute;
      left: 10px;
      bottom: -24px;
      font-size: 9px;
      letter-spacing: 1.5px;
      white-space: nowrap;
      opacity: .68;
      pointer-events: none;
    }

    /* MODO GRILLA 2D */
    body.grid-view {
      overflow-y: auto;
    }

    body.grid-view .space {
      position: relative;
      perspective: none;
      overflow: visible;
      min-height: 100vh;
      padding: 130px 5vw 60px;
    }

    body.grid-view .scene {
      position: relative;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 45px 24px;
      transform: none !important;
    }

    body.grid-view .photo {
      position: relative !important;
      left: auto !important;
      top: auto !important;
      transform: none !important;
      opacity: 1 !important;
      width: 100% !important;
      visibility: visible !important;
      pointer-events: auto !important;
      animation: fadeInGrid .4s ease forwards;
    }

    body.grid-view .photo img {
      cursor: pointer;
    }

    @keyframes fadeInGrid {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    body.grid-view .space::after {
      display: none;
    }

    /* INTERFAZ */
    .interface {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      padding: 28px 42px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 10px;
      line-height: 16px;
      letter-spacing: 1.5px;
    }

    .brand { display: flex; flex-direction: column; gap: 7px; }
    .brand strong { font-size: 21px; font-weight: normal; letter-spacing: 4px; }
    .muted { opacity: .62; }

    .right { text-align: right; pointer-events: auto; }

    .toggle-btn {
      background: transparent;
      border: 1px solid var(--ink);
      color: var(--ink);
      padding: 6px 12px;
      font-family: inherit;
      font-size: 9px;
      letter-spacing: 1.5px;
      cursor: pointer;
      margin-top: 8px;
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }

    .toggle-btn:hover {
      background: var(--ink);
      color: var(--paper);
    }

    .toggle-btn:active {
      transform: scale(.96);
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 30px;
      z-index: 10;
      transform: translateX(-50%);
      font-size: 9px;
      letter-spacing: 2px;
      opacity: .62;
      pointer-events: none;
      animation: breathe 2.8s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: .38; }
      50% { opacity: .82; }
    }

    /* VENTANA MODAL (FICHA TÉCNICA) */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(30, 32, 31, .85);
      backdrop-filter: blur(4px);
    }

    .modal-card {
      position: relative;
      z-index: 1;
      background: var(--paper);
      border: 2px solid var(--ink);
      padding: 24px;
      max-width: 90vw;
      max-height: 88vh;
      width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 30px 60px rgba(0,0,0,.4);
      transform: scale(.92);
      transition: transform .3s ease;
    }

    .modal.active .modal-card {
      transform: scale(1);
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 14px;
      background: transparent;
      border: none;
      font-size: 22px;
      font-family: inherit;
      color: var(--ink);
      cursor: pointer;
      line-height: 1;
    }

    .modal-close:hover {
      opacity: .6;
    }

    .modal-img-container {
      width: 100%;
      max-height: 48vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,.04);
      border: 1px solid var(--line);
      padding: 12px;
      margin-bottom: 14px;
    }

    .modal-img-container img {
      max-width: 100%;
      max-height: 44vh;
      object-fit: contain;
      border: 1px solid var(--ink);
      box-shadow: 0 8px 20px rgba(0,0,0,.15);
    }

    .modal-title {
      font-weight: bold;
      font-size: 11px;
      margin-bottom: 8px;
      letter-spacing: 2px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 6px;
      width: 100%;
      text-align: center;
    }

    .photo-meta-block {
      width: 100%;
      margin-top: 4px;
    }

    .photo-phrase {
      font-style: italic;
      font-size: 11px;
      line-height: 16px;
      margin: 0 0 12px 0;
      text-align: center;
      color: var(--ink);
      opacity: .9;
    }

    .photo-spec-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      font-size: 9px;
      letter-spacing: 1px;
      border-top: 1px dashed var(--line);
      padding-top: 10px;
      width: 100%;
    }

    .photo-spec-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .photo-spec-label {
      font-size: 8px;
      opacity: .5;
      letter-spacing: 1.5px;
      font-weight: bold;
    }

    .photo-spec-value {
      font-size: 9px;
      opacity: .85;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 600px) {
      .interface { padding: 20px 18px; font-size: 8px; }
      .brand strong { font-size: 16px; letter-spacing: 3px; }
      .right { max-width: 150px; }
      .space::before { inset: 7vh 18px; }
      .photo { width: clamp(135px, 42vw, 220px); }
      .hint { bottom: 20px; font-size: 8px; }
      .modal-card { padding: 18px; width: 92vw; }
      .photo-spec-grid { grid-template-columns: 1fr; gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="space" id="space" aria-label="Archivo fotográfico en movimiento">
    <div class="scene" id="scene"></div>
  </main>

  <header class="interface">
    <div class="brand">
      <span class="muted">BAV / PHOTOGRAPHIC ARCHIVE</span>
      <strong>CAMERA CLUB</strong>
    </div>
    <div class="right">
      <div class="muted">
        CONTACT SHEET / 3D SPACE<br>
        SCROLL TO TRAVEL<br>
        UNIT 05
      </div>
      <button class="toggle-btn" id="modeToggle">MODE: 3D SPACE</button>
    </div>
  </header>

  <div class="hint" id="hint">SCROLL / DRAG TO TRAVEL</div>

  <!-- VENTANA MODAL -->
  <div class="modal" id="photoModal" aria-hidden="true">
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal-card">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-img-container">
        <img id="modalImg" src="" alt="Fotografía ampliada">
      </div>
      <div class="modal-title" id="modalTitle">FRAME 000 / ARCHIVE</div>
      
      <div class="photo-meta-block">
        <p class="photo-phrase" id="modalPhrase">"Frase descriptiva..."</p>
        <div class="photo-spec-grid">
          <div class="photo-spec-item">
            <span class="photo-spec-label">LOC</span>
            <span class="photo-spec-value" id="modalLoc">--</span>
          </div>
          <div class="photo-spec-item">
            <span class="photo-spec-label">DATE</span>
            <span class="photo-spec-value" id="modalDate">--</span>
          </div>
          <div class="photo-spec-item">
            <span class="photo-spec-label">CAM</span>
            <span class="photo-spec-value" id="modalCam">--</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const myPhotos = [
      {
        id: '001',
        src: 'img/book/book64.jpg',
        phrase: 'Amanecer sobre la costa vasca.',
        location: 'SAN SEBASTIÁN',
        date: '14 OCT 2025',
        camera: 'LEICA M6 · 35MM'
      },
      {
        id: '002',
        src: 'img/book/book70.jpg',
        phrase: 'Sombra proyectada en la estación central.',
        location: 'BERLÍN',
        date: '03 NOV 2025',
        camera: 'OLYMPUS OM-1'
      },
      {
        id: '003',
        src: 'img/book/book3.jpg',
        phrase: 'Geometría urbana y hormigón.',
        location: 'MADRID',
        date: '22 DIC 2025',
        camera: 'CANON AE-1'
      },
      {
        id: '004',
        src: 'img/book/book12.jpg',
        phrase: 'Niebla matutina en el muelle.',
        location: 'VIGO',
        date: '08 ENE 2026',
        camera: 'HASSELBLAD 500C'
      },
      {
        id: '005',
        src: 'img/book/book18.jpg',
        phrase: 'Luz filtrada entre edificios.',
        location: 'TOKYO',
        date: '19 FEB 2026',
        camera: 'CONTAX T2'
      },
      {
        id: '005',
        src: 'img/book/book20.jpg',
        phrase: 'Luz filtrada entre edificios.',
        location: 'TOKYO',
        date: '19 FEB 2026',
        camera: 'CONTAX T2'
      },
      {
        id: '005',
        src: 'img/book/book26.JPEG',
        phrase: 'Luz filtrada entre edificios.',
        location: 'TOKYO',
        date: '19 FEB 2026',
        camera: 'CONTAX T2'
       },
       {
         id: '005',
         src: 'img/book/book51.JPEG',
         phrase: 'Luz filtrada entre edificios.',
         location: 'TOKYO',
         date: '19 FEB 2026',
         camera: 'CONTAX T2'
        },
        {
          id: '005',
          src: 'img/book/book11.jpg',
          phrase: 'Luz filtrada entre edificios.',
          location: 'TOKYO',
          date: '19 FEB 2026',
          camera: 'CONTAX T2'
        },
        {
          id: '005',
          src: 'img/book/book6.jpg',
          phrase: 'Luz filtrada entre edificios.',
          location: 'TOKYO',
          date: '19 FEB 2026',
          camera: 'CONTAX T2'
        }
    ];

    const scene = document.querySelector('#scene');
    const modeToggle = document.querySelector('#modeToggle');
    const hint = document.querySelector('#hint');

    const photoModal = document.querySelector('#photoModal');
    const modalOverlay = document.querySelector('#modalOverlay');
    const modalClose = document.querySelector('#modalClose');
    const modalImg = document.querySelector('#modalImg');
    const modalTitle = document.querySelector('#modalTitle');
    const modalPhrase = document.querySelector('#modalPhrase');
    const modalLoc = document.querySelector('#modalLoc');
    const modalDate = document.querySelector('#modalDate');
    const modalCam = document.querySelector('#modalCam');

    const totalPhotos = myPhotos.length;
    const depth = 1000 * Math.max(totalPhotos, 5);
    const cards = [];
    let travel = 0;
    let targetTravel = 0;
    let viewportWidth = window.innerWidth;
    let viewportHeight = window.innerHeight;
    let isGridView = false;
    let isHoveringCard = false;

    let targetTiltX = 0, targetTiltY = 0;
    let tiltX = 0, tiltY = 0;
    let touchStartY = 0;

    // REDUCCIÓN DEL RADIO PARA MANTENER LAS FOTOS CERCA DEL CENTRO
    function getFixedPosition(index, total) {
      const angle = (index / total) * Math.PI * 2;
      const radiusX = 0.55; // Reducido de 0.65 a 0.30
      const radiusY = 0.35; // Reducido de 0.45 a 0.22
      
      const x = Math.cos(angle * 2.5) * radiusX;
      const y = Math.sin(angle * 1.8) * radiusY;
      const rotation = ((index % 5) - 2) * 2.5;

      return { x, y, rotation };
    }

    function createPhotos() {
      const fragment = document.createDocumentFragment();

      myPhotos.forEach((photoData, i) => {
        const figure = document.createElement('figure');
        const image = document.createElement('img');

        image.src = photoData.src;
        image.alt = `Fotografía de archivo ${photoData.id}`;
        image.onerror = () => {
          image.src = `https://via.placeholder.com/600x750/3e4140/d6d0c4?text=FRAME+${photoData.id}`;
        };

        figure.className = 'photo';
        figure.dataset.label = `FRAME ${photoData.id} / ARCHIVE`;
        figure.appendChild(image);
        fragment.appendChild(figure);

        figure.addEventListener('mouseenter', () => {
          if (figure.classList.contains('clickable')) {
            isHoveringCard = true;
          }
        });
        figure.addEventListener('mouseleave', () => {
          isHoveringCard = false;
        });

        const pos = getFixedPosition(i, totalPhotos);

        cards.push({
          element: figure,
          image: photoData,
          x: pos.x,
          y: pos.y,
          z: (i / totalPhotos) * depth,
          rotation: pos.rotation
        });
      });

      scene.appendChild(fragment);
    }

    function resize() {
      viewportWidth = window.innerWidth;
      viewportHeight = window.innerHeight;
    }

    function render() {
      if (!isGridView) {
        travel += (targetTravel - travel) * .075;

        const activeTargetTiltX = isHoveringCard ? 0 : targetTiltX;
        const activeTargetTiltY = isHoveringCard ? 0 : targetTiltY;

        tiltX += (activeTargetTiltX - tiltX) * 0.08;
        tiltY += (activeTargetTiltY - tiltY) * 0.08;
        scene.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;

        for (let i = 0; i < cards.length; i++) {
          const card = cards[i];
          const distance = ((card.z - travel) % depth + depth) % depth;
          const proximity = 1 - distance / depth;
          
          // CONVERGENCIA Y DESVANECIMIENTO CERCANO
          // Las fotos se desvanecen suavemente antes de tocar los bordes de la pantalla (proximity > 0.82)
          let opacity = Math.min(1, Math.max(0, (depth - distance) / 760));
          if (proximity > 0.35) {
            opacity = Math.max(0, (1 - proximity) / 0.03);
          }

          const isVisible = opacity > 0.01;

          if (!isVisible) {
            if (card.element.style.visibility !== 'hidden') {
              card.element.style.visibility = 'hidden';
              card.element.style.pointerEvents = 'none';
              card.element.classList.remove('clickable');
            }
            continue;
          }

          const isClickable = proximity > 0.3 && proximity < 0.88;
          if (isClickable) {
            card.element.classList.add('clickable');
          } else {
            card.element.classList.remove('clickable');
          }

          // La posición X e Y se atraen hacia el centro a medida que la imagen se acerca
          const convergence = 1 - Math.pow(proximity, 1.5) * 0.42;
          const x = card.x * viewportWidth * convergence;
          const y = card.y * viewportHeight * convergence;
          
          const scale = .22 + proximity * 1.35;
          const zIndex = Math.round(proximity * 1000);

          card.element.style.visibility = 'visible';
          card.element.style.pointerEvents = isClickable ? 'auto' : 'none';
          card.element.style.transform =
            `translate3d(calc(-50% + ${x}px), calc(-50% + ${y}px), ${-distance}px) ` +
            `scale(${scale}) rotate(${card.rotation}deg)`;
          card.element.style.opacity = opacity;
          card.element.style.zIndex = zIndex;
        }
      }

      requestAnimationFrame(render);
    }

    function openModal(cardData) {
      modalImg.src = cardData.image.src;
      modalTitle.innerText = cardData.element.dataset.label;
      
      modalPhrase.innerText = cardData.image.phrase ? `"${cardData.image.phrase}"` : '';
      modalLoc.innerText = cardData.image.location || '--';
      modalDate.innerText = cardData.image.date || '--';
      modalCam.innerText = cardData.image.camera || '--';

      photoModal.classList.add('active');
      photoModal.setAttribute('aria-hidden', 'false');
    }

    function closeModal() {
      photoModal.classList.remove('active');
      photoModal.setAttribute('aria-hidden', 'true');
    }

    scene.addEventListener('click', event => {
      const photoEl = event.target.closest('.photo');
      if (!photoEl) return;

      if (isGridView || photoEl.classList.contains('clickable')) {
        const card = cards.find(c => c.element === photoEl);
        if (card) openModal(card);
      }
    });

    modalClose.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', closeModal);
    window.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeModal();
    });

    window.addEventListener('mousemove', event => {
      if (isGridView) return;
      const x = (event.clientX / viewportWidth) - 0.5;
      const y = (event.clientY / viewportHeight) - 0.5;
      targetTiltX = y * -3.5;
      targetTiltY = x * 3.5;
    });

    window.addEventListener('touchstart', event => {
      if (isGridView) return;
      touchStartY = event.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchmove', event => {
      if (isGridView) return;
      const touchY = event.touches[0].clientY;
      const deltaY = touchStartY - touchY;
      touchStartY = touchY;
      targetTravel += deltaY * 5;
    }, { passive: true });

    window.addEventListener('deviceorientation', event => {
      if (isGridView || !event.gamma || !event.beta) return;
      targetTiltY = Math.min(Math.max(event.gamma, -10), 10) * 0.3;
      targetTiltX = Math.min(Math.max(event.beta - 45, -10), 10) * -0.3;
    }, true);

    window.addEventListener('wheel', event => {
      if (isGridView) return;
      event.preventDefault();
      targetTravel -= event.deltaY * 1.05;
    }, { passive: false });

    modeToggle.addEventListener('click', () => {
      isGridView = !isGridView;

      if (isGridView) {
        const sortedCards = [...cards].sort((a, b) => {
          const distA = ((a.z - travel) % depth + depth) % depth;
          const distB = ((b.z - travel) % depth + depth) % depth;
          return distA - distB;
        });

        const fragment = document.createDocumentFragment();
        sortedCards.forEach(card => fragment.appendChild(card.element));
        scene.appendChild(fragment);

        document.body.classList.add('grid-view');
        modeToggle.innerText = 'MODE: GRID 2D';
        hint.style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'instant' });
      } else {
        document.body.classList.remove('grid-view');
        modeToggle.innerText = 'MODE: 3D SPACE';
        hint.style.display = 'block';
      }
    });

    window.addEventListener('resize', resize);
    createPhotos();
    resize();
    render();
  </script>
</body>
</html>
