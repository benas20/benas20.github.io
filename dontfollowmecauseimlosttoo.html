<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    color:#e8dfce;
    user-select: none;
    caret-color: transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    background:linear-gradient(00deg,#EF3340 0%,#ffffff 25%,#00247D 50%,#ffffff 75%,#EF3340 100%); 
    overflow-x:hidden;
    overflow-y:auto;
    position:relative;
    font-family:"Courier New",monospace;
    scrollbar-width:none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar{
    display:none;
}

/* =========================
   TEXTO DE FONDO
========================= */

.title-wall{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
}

.title-wall span{
    position:absolute;

    font-size:clamp(16px,3vh,32px);
    font-weight:normal;
    letter-spacing:1px;
    white-space:nowrap;

    opacity:.25;

    transform:
        translate(-50%,-50%)
        rotate(var(--rotation));
}

/* =========================
   BLOQUE DE FOTOS
========================= */

.photo-block{
    position:relative;
    width:100%;
    height:1050px;
    margin-bottom:700px;
    overflow:visible;
}

.photo-block-last{
    position:relative;
    width:100%;
    height:800px;
    margin-bottom:100px;
    overflow:visible;
}

/* =========================
   ENLACES DE LAS IMÁGENES
========================= */

.card-link{
    position:absolute;

    left:var(--x);
    top:var(--y);

    width:var(--w);

    transform:
        translate(-50%,-50%)
        rotate(var(--r));

    cursor:pointer;

    z-index:var(--z);

    transition:
        transform .2s ease,
        z-index 0s;

    user-select:none;
    -webkit-user-select:none;
    -webkit-user-drag:none;

    text-decoration:none;
}

/* =========================
   IMÁGENES
========================= */

.card{
    position:relative;

    width:100%;
    height:auto;

    display:block;

    user-select:none;
    -webkit-user-select:none;
    -webkit-user-drag:none;
}

.card-link:hover{
    z-index:9999 !important;

    transform:
        translate(-50%,-50%)
        scale(1.08)
        rotate(var(--r));
}

/* =========================
   INFO INTRO
========================= */

.info-header{
    position:relative;
    z-index:20;

    width:fit-content;
    margin:30px auto 00px;
    padding:18px 24px;

    background-color:rgba(0,0,0,0.3);

    font-size:10px;
    line-height:1.8;
    letter-spacing:2px;

    text-align:center;
}

.info-header .main{
    font-size:12px;
    margin-bottom:8px;
}

.info-header .secondary{
    opacity:.55;
}

.info-header .instruction{
    margin-top:14px;
    opacity:.7;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 768px){

    .info-header{
        width:calc(100% - 28px);
        margin:18px auto 0;
        padding:14px 12px;
        font-size:8px;
        line-height:1.7;
        letter-spacing:1px;
    }

    .info-header .main{
        font-size:10px;
    }

    .info-header .instruction{
        margin-top:10px;
    }

    .card-link{
        width:min(var(--w), 28vw);
    }

    .photo-block{
        height:780px;
        margin-bottom:700px;
    }

    .photo-block-last{
        height:780px;
        margin-bottom:700px;
    }

    .title-wall span{
        font-size:clamp(13px, 3vh, 24px);
        letter-spacing:0;
    }
}

@media (max-width: 480px){  

    .info-header{         
        
        width:calc(100% - 20px);         
        margin-top:12px;         
        padding:12px 8px;         
        font-size:7px;         
        line-height:1.6;         
        letter-spacing:.5px;     
    }     

    .info-header .main{
            
        font-size:9px;         
        margin-bottom:5px;     
    }    

    .info-header .instruction{

        margin-top:8px;     
    }      

    .card-link{         

        width:min(var(--w), 38vw);     
    }      
    
    .photo-block{         
        height:700px;         
        margin-bottom:620px;     
    }      

.photo-block-last{         
        height:700px;         
        margin-bottom:620px;     
    }  

    .card-link:hover{         
        transform:             
        translate(-50%,-50%)             
        scale(1.04)             
        rotate(var(--r));     
    }      
    .title-wall span{   

        font-size:clamp(11px, 2.8vh, 20px);     
    } 
}

</style>

});


/* =========================

const titleWall=document.getElementById("titleWall");

const words=[
    "dontfollowmecauseimlosttoo",
    "dontfollowmecauseimlosttoo",
    "อย่าตามมานะ เพราะฉันเองก็หลงทางเหมือนกัน",

    "เพราะฉันเองก็หลงทางเหมือนกัน",
    "imsoLOST",
    "DON'T FOLLOW ME"
];

const totalTitles=100;

for(let i=0;i<totalTitles;i++){

    const title=document.createElement("span");

    title.textContent=
        words[Math.floor(Math.random()*words.length)];

    const x=Math.random()*100;
    const y=Math.random()*100;

    const rotation=-8+Math.random()*16;
    const size=2.2+Math.random()*1.8;

    title.style.left=`${x}%`;
    title.style.top=`${y}%`;

    title.style.setProperty(
        "--rotation",
        `${rotation}deg`
    );

    title.style.fontSize=`${size}vh`;

    titleWall.appendChild(title);
}

</script>
