    box-sizing:border-box;

html,

    width:100%;

    background-color:#650015;
    overflow-x:hidden;
}

body{
    font-family:"Courier New",monospace;
}

/* =========================
   BLOQUE DE FOTOS
========================= */

.photo-block{
    position:relative;
    width:100%;
    height:900px;
    margin-bottom:1000px;
}

/* =========================
   IMÁGENES
========================= */

.card{
    position:absolute;

    /*
       CAMBIA ESTOS VALORES
       PARA COLOCAR CADA FOTO
    */

    left:var(--x);
    top:var(--y);

    width:var(--w);

    transform:
        translate(-50%,-50%)
        rotate(var(--r));

    cursor:pointer;

    user-select:none;
    -webkit-user-select:none;
    -webkit-user-drag:none;

    transition:
        transform .2s ease,
        z-index 0s;
}

.card:hover{
    z-index:9999 !important;

    transform:
        translate(-50%,-50%)
        scale(1.08)
        rotate(var(--r));
}

</style>
