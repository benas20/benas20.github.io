<style>

*{
    margin:0;

    box-sizing:border-box;
    color:#e8dfce;
}

html,
body{
    width:100%;
    min-height:100%;
    background-color:#650015;
    overflow-x:hidden;
    overflow-y:auto;
    position:relative;
    font-family:"Courier New",monospace;
    scrollbar-width:none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar{
    display:none;
}

body{
    font-family:"Courier New",monospace;
}

/* =========================
   TEXTO DE FONDO
========================= */

.title-wall{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
}

.title-wall span{
    position:absolute;

    font-size:clamp(16px, 3vh, 32px);
    font-weight:normal;
    letter-spacing:1px;
    white-space:nowrap;

    opacity:.25;

    transform:translate(-50%,-50%) rotate(var(--rotation));
}

/* =========================
   BLOQUE DE FOTOS
========================= */

.photo-block{
    position:relative;
    width:100%;
    height:900px;
    margin-bottom:850px;
    overflow:visible;
}

/* =========================
   IMÁGENES
========================= */

.card{
    position:absolute;

    /*
       CAMBIA ESTOS VALORES
       PARA COLOCAR CADA FOTO
    */

    left:var(--x);
    top:var(--y);

    width:var(--w);

    transform:
        translate(-50%,-50%)
        rotate(var(--r));

    cursor:pointer;

    user-select:none;
    -webkit-user-select:none;
    -webkit-user-drag:none;

    transition:
        transform .2s ease,
        z-index 0s;
}

.card:hover{
    z-index:9999 !important;

    transform:
        translate(-50%,-50%)
        scale(1.08)
        rotate(var(--r));
}

</style>

    <script>
        
    const cards=document.querySelectorAll(".card");
    cards.forEach(card=>{
        card.addEventListener("mouseenter",()=>{
            card.style.zIndex=9999;
        });
        card.addEventListener("mouseleave",()=>{
            card.style.zIndex=1;
        });
    });
    
    const titleWall = document.getElementById("titleWall");

    const words = [
        "dontfollowmecauseimlosttoo",
        "imsoLOST",
        "DON'T FOLLOW ME"
    ];

    const totalTitles = 100;

    for(let i = 0; i < totalTitles; i++){

        const title = document.createElement("span");

        title.textContent = words[Math.floor(Math.random() * words.length)];

        const x = Math.random() * 100;
        const y = Math.random() * 100;

        const rotation = -8 + Math.random() * 16;
        const size = 2.2 + Math.random() * 1.8;

        title.style.left = `${x}%`;
        title.style.top = `${y}%`;
        title.style.setProperty("--rotation", `${rotation}deg`);
        title.style.fontSize = `${size}vh`;

        titleWall.appendChild(title);
    }
