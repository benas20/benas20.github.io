<script type="module">

import * as THREE from "three";
import {FBXLoader} from "three/addons/loaders/FBXLoader.js";


/* =========================================================
   ELEMENTOS
========================================================= */

const container=document.getElementById("scene");

const axisX=document.querySelector(".axis-x");
const axisY=document.querySelector(".axis-y");
const axisZ=document.querySelector(".axis-z");

const openBookButton=
    document.getElementById("openBookButton");

const exitReadingButton=
    document.getElementById("exitReadingButton");

const readingUI=
    document.getElementById("readingUI");

const pageCounter=
    document.getElementById("pageCounter");


/* =========================================================
   ESCENA
========================================================= */

const scene=new THREE.Scene();


const camera=new THREE.PerspectiveCamera(
    45,
    innerWidth/innerHeight,
    .1,
    1000
);

camera.position.set(
    0,
    1.2,
    11
);


/* =========================================================
   RENDERER
========================================================= */

const renderer=
    new THREE.WebGLRenderer({
        antialias:true,
        alpha:true
    });


renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.outputColorSpace=
    THREE.SRGBColorSpace;


/* SOMBRAS */

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;


container.appendChild(
    renderer.domElement
);


/* =========================================================
   LUCES
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        2
    )
);


const keyLight=
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

keyLight.position.set(
    4,
    6,
    5
);

keyLight.castShadow=true;

keyLight.shadow.mapSize.width=2048;
keyLight.shadow.mapSize.height=2048;

keyLight.shadow.camera.near=.5;
keyLight.shadow.camera.far=30;

keyLight.shadow.camera.left=-8;
keyLight.shadow.camera.right=8;
keyLight.shadow.camera.top=8;
keyLight.shadow.camera.bottom=-8;

keyLight.shadow.bias=-.0002;

scene.add(keyLight);


const fillLight=
    new THREE.DirectionalLight(
        0x9fa99b,
        1.5
    );

fillLight.position.set(
    -4,
    2,
    -3
);

scene.add(fillLight);


/* =========================================================
   MODELO FBX
========================================================= */

const fbxLoader=
    new FBXLoader();


fbxLoader.load(
    "models/book.fbx",

    object=>{

        object.traverse(
            child=>{

                if(child.isMesh){

                    child.castShadow=true;
                    child.receiveShadow=true;

                }

            }
        );


        const box=
            new THREE.Box3()
                .setFromObject(object);


        const center=
            box.getCenter(
                new THREE.Vector3()
            );


        const size=
            box.getSize(
                new THREE.Vector3()
            );


        object.position.sub(center);

        object.position.y+=1;


        object.scale.setScalar(
            3/
            Math.max(
                size.x,
                size.y,
                size.z
            )
        );


        scene.add(object);

        window.model=object;

    },

    undefined,

    error=>{
        console.error(
            "Error cargando FBX:",
            error
        );
    }
);


/* =========================================================
   ROTACION DEL MODELO
========================================================= */

let dragging=false;

let previousX=0;
let previousY=0;


container.addEventListener(
    "pointerdown",
    event=>{

        if(window.readingMode)
            return;

        dragging=true;

        previousX=
            event.clientX;

        previousY=
            event.clientY;

    }
);


window.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
    }
);


window.addEventListener(
    "pointermove",
    event=>{

        if(
            !dragging ||
            !window.model ||
            window.readingMode
        )
            return;


        window.model.rotation.y+=
            (
                event.clientX-
                previousX
            )*.01;


        window.model.rotation.x+=
            (
                event.clientY-
                previousY
            )*.01;


        previousX=
            event.clientX;

        previousY=
            event.clientY;

    }
);


/* =========================================================
   ZOOM
========================================================= */

window.addEventListener(
    "wheel",
    event=>{

        if(window.readingMode)
            return;


        camera.position.z=
            Math.max(
                7,
                Math.min(
                    10,
                    camera.position.z+
                    event.deltaY*.003
                )
            );

    }
);


/* =========================================================
   SISTEMA DE PAGINAS
========================================================= */

const TOTAL_SHEETS=4;

let currentSheet=0;

let pageDragging=false;

let draggedSheet=null;

let dragStartX=0;

let dragProgress=0;

let pageAnimating=false;


/* =========================================================
   LIBRO DE LECTURA
========================================================= */

const readingBook=
    new THREE.Group();

readingBook.visible=false;

scene.add(
    readingBook
);


/* =========================================================
   DIMENSIONES
========================================================= */

const BOOK_WIDTH=7.2;

const BOOK_HEIGHT=5;

const HALF_WIDTH=
    BOOK_WIDTH/2;

const SEGMENTS=24;

const PAGE_THICKNESS=.02;


/* =========================================================
   TEXTURAS
========================================================= */

const textureLoader=
    new THREE.TextureLoader();


const pageTextures=[];


for(let i=0;i<8;i++){

    const texture=
        textureLoader.load(
            `img/book/page${i+1}.jpg`
        );


    texture.colorSpace=
        THREE.SRGBColorSpace;


    texture.anisotropy=
        renderer
            .capabilities
            .getMaxAnisotropy();


    texture.wrapS=
        THREE.ClampToEdgeWrapping;

    texture.wrapT=
        THREE.ClampToEdgeWrapping;


    texture.minFilter=
        THREE.LinearMipmapLinearFilter;

    texture.magFilter=
        THREE.LinearFilter;


    pageTextures.push(
        texture
    );

}


/* =========================================================
   MATERIAL BORDE
========================================================= */

const sideMaterial=
    new THREE.MeshStandardMaterial({

        color:0xe3dbc3,

        roughness:1,

        metalness:0,

        side:THREE.DoubleSide

    });


/* =========================================================
   MATERIAL DE PAGINA
========================================================= */

function createFaceMaterial(
    index,
    mirror=false
){

    const texture=
        pageTextures[
            Math.max(
                0,
                Math.min(
                    7,
                    index
                )
            )
        ].clone();


    texture.colorSpace=
        THREE.SRGBColorSpace;


    texture.wrapS=
        THREE.ClampToEdgeWrapping;

    texture.wrapT=
        THREE.ClampToEdgeWrapping;


    /*
        Las caras que están físicamente
        giradas 180° necesitan invertir
        horizontalmente la textura.

        No modificamos la imagen original.
    */

    if(mirror){

        texture.repeat.set(
            -1,
            1
        );

        texture.offset.set(
            1,
            0
        );

    }
    else{

        texture.repeat.set(
            1,
            1
        );

        texture.offset.set(
            0,
            0
        );

    }


    texture.needsUpdate=true;


    return new THREE.MeshStandardMaterial({

        map:texture,

        roughness:.9,

        metalness:0,

        side:THREE.DoubleSide,

        shadowSide:THREE.DoubleSide

    });

}


/* =========================================================
   GEOMETRIA DE PAGINA
========================================================= */

function createPageGeometry(){

    const width=
        HALF_WIDTH;

    const height=
        BOOK_HEIGHT;

    const depth=
        PAGE_THICKNESS;


    const vertices=[];

    const uvs=[];

    const indices=[];


    const rows=8;

    const cols=
        SEGMENTS;


    /*
        DOS CAPAS:

        0 = cara frontal
        1 = cara trasera
    */

    for(
        let side=0;
        side<2;
        side++
    ){

        const z=
            side===0
            ? -depth/2
            : depth/2;


        for(
            let y=0;
            y<=rows;
            y++
        ){

            for(
                let x=0;
                x<=cols;
                x++
            ){

                vertices.push(

                    width*
                    x/
                    cols,

                    -height/2+
                    height*
                    y/
                    rows,

                    z

                );


                uvs.push(

                    x/cols,

                    y/rows

                );

            }

        }

    }


    const layerSize=
        (cols+1)*
        (rows+1);


    /* -----------------------------------------------------
       CARA FRONTAL
    ----------------------------------------------------- */

    for(
        let y=0;
        y<rows;
        y++
    ){

        for(
            let x=0;
            x<cols;
            x++
        ){

            const a=
                y*
                (cols+1)+
                x;

            const b=
                a+1;

            const c=
                a+
                cols+
                1;

            const d=
                c+1;


            indices.push(
                a,
                b,
                d,

                a,
                d,
                c
            );

        }

    }


    /* -----------------------------------------------------
       CARA TRASERA
    ----------------------------------------------------- */

    for(
        let y=0;
        y<rows;
        y++
    ){

        for(
            let x=0;
            x<cols;
            x++
        ){

            const a=
                layerSize+
                y*
                (cols+1)+
                x;

            const b=
                a+1;

            const c=
                a+
                cols+
                1;

            const d=
                c+1;


            indices.push(
                a,
                d,
                b,

                a,
                c,
                d
            );

        }

    }


    /* -----------------------------------------------------
       BORDE IZQUIERDO
    ----------------------------------------------------- */

    for(
        let y=0;
        y<rows;
        y++
    ){

        const f1=
            y*
            (cols+1);

        const f2=
            (y+1)*
            (cols+1);

        const b1=
            layerSize+
            f1;

        const b2=
            layerSize+
            f2;


        indices.push(
            f1,
            b1,
            b2,

            f1,
            b2,
            f2
        );

    }


    /* -----------------------------------------------------
       BORDE DERECHO
    ----------------------------------------------------- */

    for(
        let y=0;
        y<rows;
        y++
    ){

        const r1=
            y*
            (cols+1)+
            cols;

        const r2=
            (y+1)*
            (cols+1)+
            cols;

        const br1=
            layerSize+
            r1;

        const br2=
            layerSize+
            r2;


        indices.push(
            r1,
            r2,
            br2,

            r1,
            br2,
            br1
        );

    }


    /* -----------------------------------------------------
       BORDE INFERIOR
    ----------------------------------------------------- */

    for(
        let x=0;
        x<cols;
        x++
    ){

        const f1=x;

        const f2=x+1;

        const b1=
            layerSize+
            f1;

        const b2=
            layerSize+
            f2;


        indices.push(
            f1,
            f2,
            b2,

            f1,
            b2,
            b1
        );

    }


    /* -----------------------------------------------------
       BORDE SUPERIOR
    ----------------------------------------------------- */

    for(
        let x=0;
        x<cols;
        x++
    ){

        const t1=
            rows*
            (cols+1)+
            x;

        const t2=
            t1+1;

        const bt1=
            layerSize+
            t1;

        const bt2=
            layerSize+
            t2;


        indices.push(
            t1,
            bt1,
            bt2,

            t1,
            bt2,
            t2
        );

    }


    const geometry=
        new THREE.BufferGeometry();


    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            vertices,
            3
        )
    );


    geometry.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(
            uvs,
            2
        )
    );


    geometry.setIndex(
        indices
    );


    /*
        LOS GRUPOS SON IMPORTANTES.

        Grupo 0 = cara frontal
        Grupo 1 = cara trasera
        Grupo 2 = bordes
    */

    const frontCount=
        SEGMENTS*
        rows*
        6;

    const backCount=
        frontCount;

    const sideCount=
        indices.length-
        frontCount-
        backCount;


    geometry.clearGroups();


    geometry.addGroup(
        0,
        frontCount,
        0
    );


    geometry.addGroup(
        frontCount,
        backCount,
        1
    );


    geometry.addGroup(
        frontCount+
        backCount,
        sideCount,
        2
    );


    geometry.computeVertexNormals();


    geometry.userData.originalPositions=[];


    const position=
        geometry.attributes.position;


    for(
        let i=0;
        i<position.count;
        i++
    ){

        geometry.userData.originalPositions.push([

            position.getX(i),

            position.getY(i),

            position.getZ(i)

        ]);

    }


    return geometry;

}


/* =========================================================
   CREAR HOJA
========================================================= */

function createSheet(index){

    const group=
        new THREE.Group();


    /*
        =====================================================
        MAPA REAL DEL LIBRO
        =====================================================

        HOJA 0
        izquierda = page1
        derecha   = page2
        detrás    = page3

        HOJA 1
        izquierda = page3
        derecha   = page4
        detrás    = page5

        HOJA 2
        izquierda = page5
        derecha   = page6
        detrás    = page7

        HOJA 3
        izquierda = page7
        derecha   = page8
        detrás    = final
    */


    const leftIndex=
        index*2;


    const rightIndex=
        index*2+1;


    const previousRightIndex=
        index===0
        ? 0
        : rightIndex-1;


    const nextBackIndex=
        Math.min(
            7,
            rightIndex+1
        );


    /* -----------------------------------------------------
       PAGINA IZQUIERDA
    ----------------------------------------------------- */

    const leftPage=
        new THREE.Mesh(

            createPageGeometry(),

            [

                /*
                    Cara frontal.

                    Al estar la página girada
                    180° necesita mirror.
                */

                createFaceMaterial(
                    leftIndex,
                    true
                ),

                /*
                    Cara trasera.

                    Es la página anterior
                    del libro.
                */

                createFaceMaterial(
                    previousRightIndex,
                    false
                ),

                sideMaterial

            ]

        );


    leftPage.rotation.y=
        Math.PI;


    leftPage.castShadow=true;

    leftPage.receiveShadow=true;


    /* -----------------------------------------------------
       PAGINA DERECHA / HOJA QUE GIRA
    ----------------------------------------------------- */

    const rightPage=
        new THREE.Mesh(

            createPageGeometry(),

            [

                /*
                    ESTA ES LA CARA QUE APARECE
                    CUANDO LA HOJA SE HA GIRADO.

                    Ejemplo:

                    page3
                    page5
                    page7
                */

                createFaceMaterial(
                    nextBackIndex,
                    true
                ),

                /*
                    ESTA ES LA CARA VISIBLE
                    AL ABRIR EL LIBRO.

                    Ejemplo:

                    page2
                    page4
                    page6
                    page8
                */

                createFaceMaterial(
                    rightIndex,
                    false
                ),

                sideMaterial

            ]

        );


    rightPage.castShadow=true;

    rightPage.receiveShadow=true;


    group.add(
        rightPage,
        leftPage
    );


    group.userData.index=
        index;


    group.userData.rightPage=
        rightPage;


    group.userData.leftPage=
        leftPage;


    return group;

}


/* =========================================================
   CREAR LAS HOJAS
========================================================= */

const sheets=[];


for(
    let i=0;
    i<TOTAL_SHEETS;
    i++
){

    const sheet=
        createSheet(i);


    sheets.push(
        sheet
    );


    readingBook.add(
        sheet
    );

}


/* =========================================================
   ACTUALIZAR GEOMETRIA / CURVATURA
========================================================= */

function updatePageGeometry(
    mesh,
    angle
){

    const geometry=
        mesh.geometry;

    const position=
        geometry.attributes.position;

    const original=
        geometry.userData.originalPositions;


    const bend=
        Math.sin(
            Math.abs(angle)
        );


    for(
        let i=0;
        i<position.count;
        i++
    ){

        const ox=
            original[i][0];

        const oy=
            original[i][1];

        const oz=
            original[i][2];


        const t=
            ox/
            HALF_WIDTH;


        /*
            CURVATURA
        */

        const curve=
            Math.sin(
                t*
                Math.PI
            )*
            bend*
            .55;


        /*
            MANTENIDO COMO PEDISTE.

            No afecta a las UV.
            Solo controla la rotación
            progresiva de la geometría.
        */

        const localAngle=
            angle*
            t*
            .00;


        const x=
            ox*
            Math.cos(
                localAngle
            )-
            oz*
            Math.sin(
                localAngle
            );


        const z=
            ox*
            Math.sin(
                localAngle
            )+
            oz*
            Math.cos(
                localAngle
            )+
            curve;


        position.setXYZ(
            i,
            x,
            oy,
            z
        );

    }


    position.needsUpdate=true;

    geometry.computeVertexNormals();

}


/* =========================================================
   RESET GEOMETRIA
========================================================= */

function resetPageGeometry(
    mesh
){

    const position=
        mesh.geometry.attributes.position;

    const original=
        mesh.geometry.userData.originalPositions;


    for(
        let i=0;
        i<position.count;
        i++
    ){

        position.setXYZ(

            i,

            original[i][0],

            original[i][1],

            original[i][2]

        );

    }


    position.needsUpdate=true;

    mesh.geometry.computeVertexNormals();

}


/* =========================================================
   CAPAS DE RENDER
========================================================= */

function setPageLayer(
    mesh,
    order
){

    mesh.renderOrder=
        order;


    /*
        No modificamos depthTest/depthWrite
        dinámicamente.

        Las páginas son geometría opaca,
        por lo que el depth buffer debe
        funcionar normalmente.
    */

    if(
        Array.isArray(
            mesh.material
        )
    ){

        mesh.material.forEach(
            material=>{

                material.depthTest=true;

                material.depthWrite=true;

            }
        );

    }
    else{

        mesh.material.depthTest=true;

        mesh.material.depthWrite=true;

    }

}


/* =========================================================
   OCULTAR PAGINAS
========================================================= */

function hideAllPages(){

    sheets.forEach(sheet=>{

        sheet.visible=false;

        sheet.userData.rightPage.visible=false;

        sheet.userData.leftPage.visible=false;

    });

}


/* =========================================================
   RESET LIBRO
========================================================= */

function resetBook(){

    currentSheet=0;

    pageDragging=false;

    draggedSheet=null;

    dragProgress=0;

    pageAnimating=false;


    sheets.forEach(
        sheet=>{

            sheet.visible=true;

            sheet.position.set(
                0,
                1,
                0
            );

            sheet.rotation.set(
                0,
                0,
                0
            );

            sheet.renderOrder=0;


            const right=
                sheet.userData.rightPage;

            const left=
                sheet.userData.leftPage;


            resetPageGeometry(
                right
            );

            resetPageGeometry(
                left
            );


            right.position.set(
                0,
                0,
                0
            );

            left.position.set(
                0,
                0,
                0
            );


            right.rotation.y=0;

            left.rotation.y=
                Math.PI;


            setPageLayer(
                right,
                0
            );

            setPageLayer(
                left,
                0
            );

        }
    );


    updatePageVisibility();

    updatePageCounter();

}


/* =========================================================
   VISIBILIDAD NORMAL
========================================================= */

function updatePageVisibility(){

    hideAllPages();


    const current=
        sheets[currentSheet];


    if(!current)
        return;


    current.visible=true;


    current.userData.leftPage.visible=true;

    current.userData.rightPage.visible=true;

}

function updatePageCounter(){

    pageCounter.textContent =
        String(currentSheet + 1).padStart(2,"0")
        + " / "
        + String(TOTAL_SHEETS).padStart(2,"0");

}

/* =========================================================
   MOSTRAR HOJA DEBAJO
========================================================= */

function showSheetBehind(
    sheet,
    order
){

    if(!sheet)
        return;


    sheet.visible=true;

    sheet.position.z=0;


    const right=
        sheet.userData.rightPage;

    const left=
        sheet.userData.leftPage;


    right.visible=true;

    left.visible=true;


    setPageLayer(
        left,
        order
    );

    setPageLayer(
        right,
        order+1
    );

}


/* =========================================================
   PREPARAR GIRO
========================================================= */

function preparePageTurn(
    direction
){

    hideAllPages();


    const current=
        sheets[currentSheet];


    if(!current)
        return;


    /*
        La hoja actual SIEMPRE permanece
        visible durante el giro.
    */

    current.visible=true;


    const currentLeft=
        current.userData.leftPage;

    const currentRight=
        current.userData.rightPage;


    currentLeft.visible=true;

    currentRight.visible=true;


    /*
        =====================================================
        HACIA DELANTE
        =====================================================

        page1 | page2
              ↓
        page3 | page4
    */

    if(direction===1){

        const next=
            sheets[
                currentSheet+1
            ];


        /*
            page1 nunca desaparece.

            currentLeft = page1
            currentRight = page2
        */

        setPageLayer(
            currentLeft,
            10
        );

        setPageLayer(
            currentRight,
            30
        );


        if(next){

            /*
                Debajo de page2:

                page3 | page4
            */

            showSheetBehind(
                next,
                1
            );

        }

    }


    /*
        =====================================================
        HACIA ATRAS
        =====================================================

        page3 | page4
        ←
        page1 | page2
    */

    else{

        const previous=
            sheets[
                currentSheet-1
            ];


        /*
            page4 permanece visible
            mientras page3 gira.
        */

        setPageLayer(
            currentRight,
            30
        );

        setPageLayer(
            currentLeft,
            40
        );


        if(previous){

            /*
                Debajo:

                page1 | page2
            */

            showSheetBehind(
                previous,
                1
            );

        }

    }

}


/* =========================================================
   ACTUALIZAR PAGINA ARRASTRADA
========================================================= */

function updateDraggedPage(
    progress,
    direction
){

    if(!draggedSheet)
        return;


    progress=
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    const angle=
        progress*
        Math.PI;


    const right=
        draggedSheet.userData.rightPage;

    const left=
        draggedSheet.userData.leftPage;


    /*
        =====================================================
        DERECHA -> IZQUIERDA
        =====================================================
    */

    if(direction===1){

        /*
            La página derecha es la hoja
            que realmente estamos pasando.
        */

        right.visible=true;


        right.position.set(
            0,
            0,
            0
        );


        right.rotation.y=
            -angle;


        /*
            Durante todo el giro permanece
            encima de las páginas inferiores.
        */

        setPageLayer(
            right,
            30
        );


        updatePageGeometry(
            right,
            angle
        );

    }


    /*
        =====================================================
        IZQUIERDA -> DERECHA
        =====================================================
    */

    else{

        left.visible=true;


        left.position.set(
            0,
            0,
            0
        );


        left.rotation.y=
            Math.PI+
            angle;


        setPageLayer(
            left,
            40
        );


        updatePageGeometry(
            left,
            angle
        );

    }

}


/* =========================================================
   INICIO DEL DRAG
========================================================= */

function startPageDrag(
    event
){

    if(
        !window.readingMode ||
        pageAnimating ||
        pageDragging
    )
        return;


    const rect=
        renderer.domElement
            .getBoundingClientRect();


    const x=
        event.clientX-
        rect.left;

    const y=
        event.clientY-
        rect.top;


    if(
        y>=
        rect.height*.38
    )
        return;


    const fromRight=
        x>
        rect.width*.58;

    const fromLeft=
        x<
        rect.width*.42;


    if(
        !fromRight &&
        !fromLeft
    )
        return;


    let direction;


    if(fromLeft){

        if(
            currentSheet<=0
        )
            return;


        direction=-1;

    }
    else{

        if(
            currentSheet>=
            TOTAL_SHEETS-1
        )
            return;


        direction=1;

    }


    preparePageTurn(
        direction
    );


    draggedSheet=
        sheets[currentSheet];


    dragStartX=x;

    pageDragging=true;

    dragProgress=0;


    event.preventDefault();

}


/* =========================================================
   MOVER PAGINA
========================================================= */

function movePageDrag(
    event
){

    if(
        !pageDragging ||
        !draggedSheet
    )
        return;


    const rect=
        renderer.domElement
            .getBoundingClientRect();


    const x=
        event.clientX-
        rect.left;


    const direction=
        dragStartX>
        rect.width*.5
        ?1
        :-1;


    const maxMovement=
        rect.width*.65;


    let movement=
        (
            dragStartX-
            x
        )*
        direction;


    movement=
        Math.max(
            0,
            Math.min(
                maxMovement,
                movement
            )
        );


    dragProgress=
        movement/
        maxMovement;


    updateDraggedPage(
        dragProgress,
        direction
    );


    event.preventDefault();

}


/* =========================================================
   FINALIZAR DRAG
========================================================= */

function endPageDrag(){

    if(
        !pageDragging ||
        !draggedSheet
    )
        return;


    const sheet=
        draggedSheet;


    const progress=
        dragProgress;


    const direction=
        dragStartX>
        renderer.domElement
            .clientWidth*.5
        ?1
        :-1;


    pageDragging=false;

    draggedSheet=null;


    animatePage(
        sheet,
        direction,
        progress>.5
    );

}


/* =========================================================
   ANIMACION
========================================================= */

function animatePage(
    sheet,
    direction,
    complete
){

    pageAnimating=true;


    const start=
        dragProgress;


    const target=
        complete
        ?1
        :0;


    const duration=
        complete
        ?460
        :300;


    const startTime=
        performance.now();


    function animationFrame(
        now
    ){

        const raw=
            Math.min(
                1,
                (
                    now-
                    startTime
                )/
                duration
            );


        const eased=
            1-
            Math.pow(
                1-raw,
                3
            );


        const progress=
            start+
            (
                target-
                start
            )*
            eased;


        draggedSheet=
            sheet;


        updateDraggedPage(
            progress,
            direction
        );


        if(raw<1){

            requestAnimationFrame(
                animationFrame
            );

            return;

        }


        /*
            Posición final exacta.
        */

        draggedSheet=
            sheet;


        updateDraggedPage(
            target,
            direction
        );


        draggedSheet=null;


        /*
            Actualizar spread.
        */

        if(
            complete &&
            direction===1
        ){

            currentSheet=
                Math.min(
                    TOTAL_SHEETS-1,
                    currentSheet+1
                );

        }


        if(
            complete &&
            direction===-1
        ){

            currentSheet=
                Math.max(
                    0,
                    currentSheet-1
                );

        }


        resetAfterTurn();

    }


    requestAnimationFrame(
        animationFrame
    );

}


/* =========================================================
   RESET DESPUES DEL GIRO
========================================================= */

function resetAfterTurn(){

    sheets.forEach(
        sheet=>{

            sheet.visible=false;

            sheet.position.z=0;

            sheet.renderOrder=0;


            const right=
                sheet.userData.rightPage;

            const left=
                sheet.userData.leftPage;


            resetPageGeometry(
                right
            );

            resetPageGeometry(
                left
            );


            right.position.set(
                0,
                0,
                0
            );

            left.position.set(
                0,
                0,
                0
            );


            right.rotation.y=0;

            left.rotation.y=
                Math.PI;


            setPageLayer(
                right,
                0
            );

            setPageLayer(
                left,
                0
            );


            right.visible=false;

            left.visible=false;

        }
    );


    updatePageVisibility();

    updatePageCounter();


    pageAnimating=false;

}


/* =========================================================
   EVENTOS PAGINAS
========================================================= */

renderer.domElement.addEventListener(
    "pointerdown",
    startPageDrag
);


window.addEventListener(
    "pointermove",
    movePageDrag
);


window.addEventListener(
    "pointerup",
    endPageDrag
);


/* =========================================================
   ABRIR LIBRO
========================================================= */

openBookButton.addEventListener(
    "click",
    ()=>{

        if(window.readingMode)
            return;


        window.readingMode=true;


        if(window.model)
            window.model.visible=false;


        document
            .querySelector(".axis-gizmo")
            .style.display="none";


        document
            .querySelector(".model-label")
            .style.display="none";


        document
            .querySelector(".rotate-label")
            .style.display="none";


        document
            .querySelector(".buy-button")
            .style.display="none";


        openBookButton.style.display=
            "none";


        exitReadingButton.style.display=
            "flex";


        readingUI.style.display=
            "block";


        readingBook.visible=true;


        resetBook();

    }
);


/* =========================================================
   SALIR DE LECTURA
========================================================= */

exitReadingButton.addEventListener(
    "click",
    ()=>{

        window.readingMode=false;


        readingBook.visible=false;


        if(window.model)
            window.model.visible=true;


        document
            .querySelector(".axis-gizmo")
            .style.display="block";


        document
            .querySelector(".model-label")
            .style.display="block";


        document
            .querySelector(".rotate-label")
            .style.display="block";


        document
            .querySelector(".buy-button")
            .style.display=
                "inline-flex";


        exitReadingButton.style.display=
            "none";


        openBookButton.style.display=
            "flex";


        readingUI.style.display=
            "none";

    }
);


openBookButton.style.display=
    "flex";


exitReadingButton.style.display=
    "none";


/* =========================================================
   GIZMO
========================================================= */

function updateAxisGizmo(){

    if(!window.model)
        return;


    const axes={

        x:new THREE.Vector3(
            1,
            0,
            0
        ),

        y:new THREE.Vector3(
            0,
            1,
            0
        ),

        z:new THREE.Vector3(
            0,
            0,
            1
        )

    };


    const quaternion=
        window.model.quaternion;


    axes.x.applyQuaternion(
        quaternion
    );

    axes.y.applyQuaternion(
        quaternion
    );

    axes.z.applyQuaternion(
        quaternion
    );


    const getAngle=
        vector=>
            Math.atan2(
                vector.y,
                vector.x
            )*
            180/
            Math.PI;


    axisX.style.transform=
        `rotate(${getAngle(axes.x)}deg)`;


    axisY.style.transform=
        `rotate(${getAngle(axes.y)}deg)`;


    axisZ.style.transform=
        `rotate(${getAngle(axes.z)}deg)`;

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   ANIMACION PRINCIPAL
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    updateAxisGizmo();


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>

if(event.ctrlKey)event.preventDefault();
},{passive:false});

if(event.ctrlKey&&["+","-","=","0"].includes(event.key))event.preventDefault();
});
