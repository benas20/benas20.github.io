<script type="module">

import * as THREE from "three";
import {FBXLoader} from "three/addons/loaders/FBXLoader.js";


/* =========================================================
   ELEMENTOS
========================================================= */

const container=document.getElementById("scene");

const axisX=document.querySelector(".axis-x");
const axisY=document.querySelector(".axis-y");
const axisZ=document.querySelector(".axis-z");

const openBookButton=
    document.getElementById("openBookButton");

const exitReadingButton=
    document.getElementById("exitReadingButton");

const readingUI=
    document.getElementById("readingUI");

const pageCounter=
    document.getElementById("pageCounter");

/* =========================================================
   ESCENA
========================================================= */

const scene=new THREE.Scene();


const camera=new THREE.PerspectiveCamera(
    45,
    innerWidth/innerHeight,
    .1,
    1000
);

camera.position.set(
    0,
    1.2,
    11
);


/* =========================================================
   RENDERER
========================================================= */

const renderer=
    new THREE.WebGLRenderer({
        antialias:true,
        alpha:true
    });


renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);


renderer.setSize(
    innerWidth,
    innerHeight
);


renderer.outputColorSpace=
    THREE.SRGBColorSpace;


/*
    SOMBRAS
*/

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;


container.appendChild(
    renderer.domElement
);


/* =========================================================
   LUCES
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        2
    )
);


const keyLight=
    new THREE.DirectionalLight(
        0xffffff,
        3
    );


keyLight.position.set(
    4,
    6,
    5
);


/*
    SOMBRAS DE LA LUZ PRINCIPAL
*/

keyLight.castShadow=true;

keyLight.shadow.mapSize.width=2048;
keyLight.shadow.mapSize.height=2048;

keyLight.shadow.camera.near=.1;
keyLight.shadow.camera.far=30;

keyLight.shadow.camera.left=-10;
keyLight.shadow.camera.right=10;
keyLight.shadow.camera.top=10;
keyLight.shadow.camera.bottom=-10;

keyLight.shadow.bias=-0.0005;
keyLight.shadow.normalBias=.01;


scene.add(
    keyLight
);


const fillLight=
    new THREE.DirectionalLight(
        0x9fa99b,
        1.5
    );


fillLight.position.set(
    -4,
    2,
    -3
);


scene.add(
    fillLight
);


/* =========================================================
   MODELO FBX
========================================================= */

const fbxLoader=
    new FBXLoader();


fbxLoader.load(
    "models/book.fbx",

    object=>{

        object.traverse(
            child=>{

                if(child.isMesh){

                    child.castShadow=true;
                    child.receiveShadow=true;

                }

            }
        );


        const box=
            new THREE.Box3()
                .setFromObject(object);


        const center=
            box.getCenter(
                new THREE.Vector3()
            );


        const size=
            box.getSize(
                new THREE.Vector3()
            );


        object.position.sub(
            center
        );


        object.position.y+=1;


        object.scale.setScalar(
            3/
            Math.max(
                size.x,
                size.y,
                size.z
            )
        );


        scene.add(
            object
        );


        window.model=
            object;

    },

    undefined,

    error=>{

        console.error(
            "Error cargando FBX:",
            error
        );

    }
);


/* =========================================================
   ROTACION DEL MODELO
========================================================= */

let dragging=false;

let previousX=0;
let previousY=0;


container.addEventListener(
    "pointerdown",
    event=>{

        if(window.readingMode)
            return;


        dragging=true;

        previousX=
            event.clientX;

        previousY=
            event.clientY;

    }
);


window.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
    }
);


window.addEventListener(
    "pointermove",
    event=>{

        if(
            !dragging ||
            !window.model ||
            window.readingMode
        )
            return;


        window.model.rotation.y+=
            (
                event.clientX-
                previousX
            )*.01;


        window.model.rotation.x+=
            (
                event.clientY-
                previousY
            )*.01;


        previousX=
            event.clientX;

        previousY=
            event.clientY;

    }
);


/* =========================================================
   ZOOM
========================================================= */

window.addEventListener(
    "wheel",
    event=>{

        if(window.readingMode)
            return;


        camera.position.z=
            Math.max(
                7,
                Math.min(
                    10,
                    camera.position.z+
                    event.deltaY*.003
                )
            );

    }
);

/* =========================================================
   SISTEMA DE PAGINAS
========================================================= */

const TOTAL_SHEETS=4;

let currentSheet=0;
let pageDragging=false;
let draggedSheet=null;
let dragStartX=0;
let dragProgress=0;
let pageAnimating=false;


/* =========================================================
   LIBRO DE LECTURA
========================================================= */

const readingBook=
    new THREE.Group();

readingBook.visible=false;

scene.add(readingBook);


/* =========================================================
   DIMENSIONES
========================================================= */

const BOOK_WIDTH=7.2;
const BOOK_HEIGHT=5;

const HALF_WIDTH=
    BOOK_WIDTH/2;

const SEGMENTS=24;

const PAGE_THICKNESS=.025;


/* =========================================================
   TEXTURAS
========================================================= */

const textureLoader=
    new THREE.TextureLoader();

const pageTextures=[];


for(let i=0;i<8;i++){

    const texture=
        textureLoader.load(
            `img/book/page${i+1}.jpg`
        );

    texture.colorSpace=
        THREE.SRGBColorSpace;

    texture.anisotropy=
        renderer.capabilities.getMaxAnisotropy();

    texture.wrapS=
        THREE.ClampToEdgeWrapping;

    texture.wrapT=
        THREE.ClampToEdgeWrapping;

    pageTextures.push(texture);

}


/* =========================================================
   MATERIAL DEL CANTO
========================================================= */

const sideMaterial=
    new THREE.MeshStandardMaterial({

        color:0xe3dbc3,

        roughness:1,

        metalness:0

    });


/* =========================================================
   MATERIAL DE UNA CARA
========================================================= */

function createFaceMaterial(index){

    const texture=
        pageTextures[index].clone();

    texture.colorSpace=
        THREE.SRGBColorSpace;

    texture.wrapS=
        THREE.ClampToEdgeWrapping;

    texture.wrapT=
        THREE.ClampToEdgeWrapping;

    texture.anisotropy=
        renderer.capabilities.getMaxAnisotropy();

    texture.repeat.set(1,1);

    texture.offset.set(0,0);

    texture.needsUpdate=true;


    return new THREE.MeshStandardMaterial({

        map:texture,

        roughness:.9,

        metalness:0,

        side:THREE.FrontSide

    });

}


/* =========================================================
   GEOMETRIA DE HOJA FISICA
========================================================= */

function createPageGeometry(){

    const width=
        HALF_WIDTH;

    const height=
        BOOK_HEIGHT;

    const depth=
        PAGE_THICKNESS;

    const rows=8;
    const cols=SEGMENTS;

    const vertices=[];
    const uvs=[];
    const indices=[];


    /* =====================================================
       DOS CAPAS

       0 = DELANTE
       1 = DETRAS
    ===================================================== */

    for(let side=0;side<2;side++){

        const z=
            side===0
            ? -depth/2
            : depth/2;


        for(let y=0;y<=rows;y++){

            for(let x=0;x<=cols;x++){

                vertices.push(

                    width*x/cols,

                    -height/2+
                    height*y/rows,

                    z

                );

                uvs.push(

                    x/cols,

                    y/rows

                );

            }

        }

    }


    const layerSize=
        (cols+1)*(rows+1);


    /* =====================================================
       DELANTE
    ===================================================== */

    for(let y=0;y<rows;y++){

        for(let x=0;x<cols;x++){

            const a=
                y*(cols+1)+x;

            const b=
                a+1;

            const c=
                a+cols+1;

            const d=
                c+1;


            indices.push(
                a,b,d,
                a,d,c
            );

        }

    }


    const frontCount=
        indices.length;


    /* =====================================================
       DETRAS
    ===================================================== */

    for(let y=0;y<rows;y++){

        for(let x=0;x<cols;x++){

            const a=
                layerSize+
                y*(cols+1)+x;

            const b=
                a+1;

            const c=
                a+cols+1;

            const d=
                c+1;


            indices.push(
                a,d,b,
                a,c,d
            );

        }

    }


    const backCount=
        indices.length-frontCount;


    /* =====================================================
       CANTOS LATERALES
    ===================================================== */

    for(let y=0;y<rows;y++){

        const f1=
            y*(cols+1);

        const f2=
            (y+1)*(cols+1);

        const b1=
            layerSize+f1;

        const b2=
            layerSize+f2;


        indices.push(
            f1,b1,b2,
            f1,b2,f2
        );


        const r1=
            y*(cols+1)+cols;

        const r2=
            (y+1)*(cols+1)+cols;

        const br1=
            layerSize+r1;

        const br2=
            layerSize+r2;


        indices.push(
            r1,r2,br2,
            r1,br2,br1
        );

    }


    for(let x=0;x<cols;x++){

        const f1=x;
        const f2=x+1;

        const b1=
            layerSize+f1;

        const b2=
            layerSize+f2;


        indices.push(
            f1,f2,b2,
            f1,b2,b1
        );


        const t1=
            rows*(cols+1)+x;

        const t2=
            t1+1;

        const bt1=
            layerSize+t1;

        const bt2=
            layerSize+t2;


        indices.push(
            t1,bt1,bt2,
            t1,bt2,t2
        );

    }


    const geometry=
        new THREE.BufferGeometry();


    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            vertices,
            3
        )
    );


    geometry.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(
            uvs,
            2
        )
    );


    geometry.setIndex(indices);


    geometry.clearGroups();


    geometry.addGroup(
        0,
        frontCount,
        0
    );


    geometry.addGroup(
        frontCount,
        backCount,
        1
    );


    geometry.addGroup(
        frontCount+backCount,
        indices.length-frontCount-backCount,
        2
    );


    geometry.computeVertexNormals();


    geometry.userData.originalPositions=[];


    const position=
        geometry.attributes.position;


    for(
        let i=0;
        i<position.count;
        i++
    ){

        geometry.userData.originalPositions.push([

            position.getX(i),
            position.getY(i),
            position.getZ(i)

        ]);

    }


    return geometry;

}


/* =========================================================
   CREAR UNA HOJA FISICA
========================================================= */

function createSheet(index){

    const group=
        new THREE.Group();


    /*
        Cada hoja física tiene DOS caras:

        HOJA 0
        delante = PAGE 2
        detrás  = PAGE 3

        HOJA 1
        delante = PAGE 4
        detrás  = PAGE 5

        HOJA 2
        delante = PAGE 6
        detrás  = PAGE 7

        HOJA 3
        delante = PAGE 8
        detrás  = PAGE 8
    */


    const frontIndex=
        index*2+1;


    const backIndex=
        Math.min(
            7,
            frontIndex+1
        );


    const page=
        new THREE.Mesh(

            createPageGeometry(),

            [

                createFaceMaterial(
                    frontIndex
                ),

                createFaceMaterial(
                    backIndex
                ),

                sideMaterial

            ]

        );


    page.position.set(
        0,
        0,
        0
    );


    page.rotation.y=0;


    page.castShadow=true;
    page.receiveShadow=true;


    group.add(page);


    group.userData.index=
        index;

    group.userData.page=
        page;


    return group;

}


/* =========================================================
   CREAR LAS HOJAS
========================================================= */

const sheets=[];


for(
    let i=0;
    i<TOTAL_SHEETS;
    i++
){

    const sheet=
        createSheet(i);

    sheets.push(sheet);

    readingBook.add(sheet);

}


/* =========================================================
   PAGINA 1 FIJA
========================================================= */

const firstPage=
    new THREE.Mesh(

        createPageGeometry(),

        [

            createFaceMaterial(0),

            createFaceMaterial(0),

            sideMaterial

        ]

    );


firstPage.rotation.y=
    Math.PI;

firstPage.position.set(
    0,
    0,
    0
);

firstPage.castShadow=true;
firstPage.receiveShadow=true;

readingBook.add(
    firstPage
);


/* =========================================================
   CURVATURA
========================================================= */

function updatePageGeometry(
    mesh,
    angle
){

    const geometry=
        mesh.geometry;

    const position=
        geometry.attributes.position;

    const original=
        geometry.userData.originalPositions;


    const bend=
        Math.sin(
            Math.abs(angle)
        );


    for(
        let i=0;
        i<position.count;
        i++
    ){

        const ox=
            original[i][0];

        const oy=
            original[i][1];

        const oz=
            original[i][2];


        const t=
            ox/HALF_WIDTH;


        const curve=
            Math.sin(
                t*Math.PI
            )
            *
            bend
            *
            .55;


        const localAngle=
            angle*
            t*
            .00;


        const x=
            ox*
            Math.cos(localAngle)
            -
            oz*
            Math.sin(localAngle);


        const z=
            ox*
            Math.sin(localAngle)
            +
            oz*
            Math.cos(localAngle)
            +
            curve;


        position.setXYZ(
            i,
            x,
            oy,
            z
        );

    }


    position.needsUpdate=true;

    geometry.computeVertexNormals();

}


/* =========================================================
   RESET GEOMETRIA
========================================================= */

function resetPageGeometry(mesh){

    const position=
        mesh.geometry.attributes.position;

    const original=
        mesh.geometry.userData.originalPositions;


    for(
        let i=0;
        i<position.count;
        i++
    ){

        position.setXYZ(

            i,

            original[i][0],
            original[i][1],
            original[i][2]

        );

    }


    position.needsUpdate=true;

    mesh.geometry.computeVertexNormals();

}


/* =========================================================
   CAPAS
========================================================= */

function setPageLayer(
    mesh,
    order
){

    mesh.renderOrder=
        order;

    mesh.material.forEach(
        material=>{

            material.depthTest=true;

            material.depthWrite=true;

        }
    );

}


/* =========================================================
   OCULTAR PAGINAS
========================================================= */

function hideAllPages(){

    sheets.forEach(sheet=>{

        sheet.visible=false;

        sheet.userData.page.visible=false;

    });

    firstPage.visible=false;

}


/* =========================================================
   RESET DEL LIBRO
========================================================= */

function resetBook(){

    currentSheet=0;

    pageDragging=false;

    draggedSheet=null;

    dragProgress=0;

    pageAnimating=false;


    sheets.forEach(
        sheet=>{

            sheet.visible=true;

            sheet.position.set(
                0,
                1,
                0
            );

            sheet.rotation.set(
                0,
                0,
                0
            );

            sheet.renderOrder=0;


            const page=
                sheet.userData.page;


            resetPageGeometry(
                page
            );


            page.position.set(
                0,
                0,
                0
            );


            page.rotation.y=0;


            setPageLayer(
                page,
                0
            );

        }
    );


    firstPage.position.set(
        0,
        1,
        0
    );

    firstPage.rotation.y=
        Math.PI;

    firstPage.visible=true;

    setPageLayer(
        firstPage,
        0
    );


    updatePageVisibility();

    updatePageCounter();

}


/* =========================================================
   VISIBILIDAD
========================================================= */

function updatePageVisibility(){

    hideAllPages();


    /*
        La página izquierda visible
        siempre es la cara posterior
        de la hoja anterior.

        Al principio es PAGE 1.
    */

    if(currentSheet===0){

        firstPage.visible=true;

    }
    else{

        const previous=
            sheets[currentSheet-1];

        previous.visible=true;

        previous.userData.page.visible=true;

        previous.userData.page.rotation.y=
            Math.PI;

    }


    /*
        La página derecha es la hoja actual.
    */

    const current=
        sheets[currentSheet];


    if(current){

        current.visible=true;

        current.userData.page.visible=true;

        current.userData.page.rotation.y=0;

    }

}


/* =========================================================
   CONTADOR
========================================================= */

function updatePageCounter(){

    pageCounter.textContent=
        String(
            currentSheet+1
        ).padStart(2,"0")
        +" / "
        +
        String(
            TOTAL_SHEETS
        ).padStart(2,"0");

}


/* =========================================================
   PREPARAR GIRO
========================================================= */

function preparePageTurn(
    direction
){

    hideAllPages();


    const current=
        sheets[currentSheet];


    current.visible=true;

    current.userData.page.visible=true;

    current.position.z=.08;


    if(direction===1){

        /*
            Hoja actual a la derecha.
        */

        current.userData.page.rotation.y=0;

        setPageLayer(
            current.userData.page,
            20
        );


        /*
            La hoja siguiente queda
            detrás de ella.
        */

        const next=
            sheets[currentSheet+1];


        if(next){

            next.visible=true;

            next.userData.page.visible=true;

            next.userData.page.rotation.y=0;

            next.position.z=0;

            setPageLayer(
                next.userData.page,
                5
            );

        }

    }
    else{

        /*
            Volvemos hacia atrás.

            La hoja anterior está
            sobre la izquierda.
        */

        const previous=
            sheets[currentSheet-1];


        if(previous){

            previous.visible=true;

            previous.userData.page.visible=true;

            previous.userData.page.rotation.y=
                Math.PI;

            previous.position.z=0;

            setPageLayer(
                previous.userData.page,
                5
            );

        }


        current.userData.page.rotation.y=
            Math.PI;

        setPageLayer(
            current.userData.page,
            20
        );

    }

}


/* =========================================================
   COMENZAR GIRO
========================================================= */

function startPageDrag(event){

    if(
        !window.readingMode ||
        pageAnimating ||
        pageDragging
    )
        return;


    const rect=
        renderer.domElement
        .getBoundingClientRect();


    const x=
        event.clientX-
        rect.left;


    const y=
        event.clientY-
        rect.top;


    if(
        y>=rect.height*.38
    )
        return;


    const fromRight=
        x>rect.width*.58;


    const fromLeft=
        x<rect.width*.42;


    if(
        !fromRight &&
        !fromLeft
    )
        return;


    let direction;


    if(fromLeft){

        if(
            currentSheet<=0
        )
            return;

        direction=-1;

    }
    else{

        if(
            currentSheet>=TOTAL_SHEETS-1
        )
            return;

        direction=1;

    }


    preparePageTurn(
        direction
    );


    draggedSheet=
        sheets[currentSheet];


    dragStartX=x;

    pageDragging=true;

    dragProgress=0;


    event.preventDefault();

}


/* =========================================================
   ARRASTRAR
========================================================= */

function movePageDrag(event){

    if(
        !pageDragging ||
        !draggedSheet
    )
        return;


    const rect=
        renderer.domElement
        .getBoundingClientRect();


    const x=
        event.clientX-
        rect.left;


    const direction=
        dragStartX>
        rect.width*.5
        ?1
        :-1;


    const maxMovement=
        rect.width*.65;


    let movement=
        (dragStartX-x)*
        direction;


    movement=
        Math.max(
            0,
            Math.min(
                maxMovement,
                movement
            )
        );


    dragProgress=
        movement/
        maxMovement;


    updateDraggedPage(
        dragProgress,
        direction
    );


    event.preventDefault();

}


/* =========================================================
   ACTUALIZAR HOJA DURANTE GIRO
========================================================= */

function updateDraggedPage(
    progress,
    direction
){

    if(!draggedSheet)
        return;


    progress=
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    const angle=
        progress*
        Math.PI;


    const page=
        draggedSheet.userData.page;


    /*
        La hoja gira físicamente.
    */

    if(direction===1){

        page.rotation.y=
            -angle;

    }
    else{

        page.rotation.y=
            Math.PI+angle;

    }


    /*
        La curvatura sigue siendo
        exactamente la del sistema
        que ya tenías.
    */

    updatePageGeometry(
        page,
        angle
    );


    const turningLayer=
        progress<.5
        ?20
        :2;


    setPageLayer(
        page,
        turningLayer
    );

}


/* =========================================================
   SOLTAR
========================================================= */

function endPageDrag(){

    if(
        !pageDragging ||
        !draggedSheet
    )
        return;


    const sheet=
        draggedSheet;

    const progress=
        dragProgress;


    const direction=
        dragStartX>
        renderer.domElement
        .clientWidth*.5
        ?1
        :-1;


    pageDragging=false;

    draggedSheet=null;


    animatePage(
        sheet,
        direction,
        progress>.5
    );

}


/* =========================================================
   ANIMACION
========================================================= */

function animatePage(
    sheet,
    direction,
    complete
){

    pageAnimating=true;


    const start=
        dragProgress;


    const target=
        complete
        ?1
        :0;


    const duration=
        complete
        ?460
        :300;


    const startTime=
        performance.now();


    function animationFrame(now){

        const raw=
            Math.min(
                1,
                (now-startTime)/
                duration
            );


        const eased=
            1-
            Math.pow(
                1-raw,
                3
            );


        const progress=
            start+
            (
                target-start
            )*
            eased;


        draggedSheet=
            sheet;


        updateDraggedPage(
            progress,
            direction
        );


        if(raw<1){

            requestAnimationFrame(
                animationFrame
            );

            return;

        }


        draggedSheet=null;


        if(
            complete &&
            direction===1
        ){

            currentSheet=
                Math.min(
                    TOTAL_SHEETS-1,
                    currentSheet+1
                );

        }


        if(
            complete &&
            direction===-1
        ){

            currentSheet=
                Math.max(
                    0,
                    currentSheet-1
                );

        }


        resetAfterTurn();

    }


    requestAnimationFrame(
        animationFrame
    );

}


/* =========================================================
   RESTAURAR
========================================================= */

function resetAfterTurn(){

    sheets.forEach(
        sheet=>{

            sheet.position.z=0;

            sheet.renderOrder=0;


            const page=
                sheet.userData.page;


            resetPageGeometry(
                page
            );


            page.position.set(
                0,
                0,
                0
            );


            page.rotation.y=0;


            setPageLayer(
                page,
                0
            );

        }
    );


    firstPage.position.set(
        0,
        1,
        0
    );

    firstPage.rotation.y=
        Math.PI;


    updatePageVisibility();

    updatePageCounter();


    pageAnimating=false;

}


/* =========================================================
   EVENTOS
========================================================= */

renderer.domElement.addEventListener(
    "pointerdown",
    startPageDrag
);

window.addEventListener(
    "pointermove",
    movePageDrag
);

window.addEventListener(
    "pointerup",
    endPageDrag
);

/* =========================================================
   ABRIR LIBRO
========================================================= */

        if(window.readingMode)

/* =========================================================
   SALIR DE LECTURA
========================================================= */

exitReadingButton.addEventListener(

        window.readingMode=false;


        readingBook.visible=

        openBookButton.style.display=

        readingUI.style.display=

    }
);


/* =========================================================
   BOTONES INICIALES
========================================================= */

openBookButton.style.display=
    "flex";


exitReadingButton.style.display=
    "none";


/* =========================================================
   GIZMO
========================================================= */

function updateAxisGizmo(){

    if(!window.model)
        return;


    const axes={

        x:new THREE.Vector3(
            1,0,0
        ),

        y:new THREE.Vector3(
            0,1,0
        ),

        z:new THREE.Vector3(
            0,0,1
        )

    };


    const quaternion=
        window.model.quaternion;


    axes.x.applyQuaternion(
        quaternion
    );

    axes.y.applyQuaternion(
        quaternion
    );

    axes.z.applyQuaternion(
        quaternion
    );


    const getAngle=
        vector=>
            Math.atan2(
                vector.y,
                vector.x
            )
            *
            180/
            Math.PI;


    axisX.style.transform=
        `rotate(${getAngle(axes.x)}deg)`;


    axisY.style.transform=
        `rotate(${getAngle(axes.y)}deg)`;


    axisZ.style.transform=
        `rotate(${getAngle(axes.z)}deg)`;

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   ANIMACION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    updateAxisGizmo();


    renderer.render(
        scene,
        camera
    );

}


animate();
