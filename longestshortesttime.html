<script type="module">
import * as THREE from "three";
import {FBXLoader} from "three/addons/loaders/FBXLoader.js";

const container=document.getElementById("scene");
const axisX=document.querySelector(".axis-x");
const axisY=document.querySelector(".axis-y");
const axisZ=document.querySelector(".axis-z");
const openBookButton=document.getElementById("openBookButton");
const exitReadingButton=document.getElementById("exitReadingButton");
const readingUI=document.getElementById("readingUI");
const pageCounter=document.getElementById("pageCounter");

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);
camera.position.set(0,1.2,11);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,2));

const keyLight=new THREE.DirectionalLight(0xffffff,3);
keyLight.position.set(4,6,5);
scene.add(keyLight);

const fillLight=new THREE.DirectionalLight(0x9fa99b,1.5);
fillLight.position.set(-4,2,-3);
scene.add(fillLight);

const fbxLoader=new FBXLoader();

fbxLoader.load("models/book.fbx",object=>{
object.traverse(child=>{
if(child.isMesh){
child.castShadow=true;
child.receiveShadow=true;
}
});

const box=new THREE.Box3().setFromObject(object);
const center=box.getCenter(new THREE.Vector3());
const size=box.getSize(new THREE.Vector3());

object.position.sub(center);
object.position.y+=1;
object.scale.setScalar(3/Math.max(size.x,size.y,size.z));
scene.add(object);
window.model=object;
},undefined,error=>console.error("Error cargando FBX:",error));

let dragging=false;
let previousX=0;
let previousY=0;

container.addEventListener("pointerdown",event=>{
if(window.readingMode)return;
dragging=true;
previousX=event.clientX;
previousY=event.clientY;
});

window.addEventListener("pointerup",()=>dragging=false);

window.addEventListener("pointermove",event=>{
if(!dragging||!window.model||window.readingMode)return;

window.model.rotation.y+=(event.clientX-previousX)*.01;
window.model.rotation.x+=(event.clientY-previousY)*.01;
previousX=event.clientX;
previousY=event.clientY;
});

window.addEventListener("wheel",event=>{
if(window.readingMode)return;
camera.position.z=Math.max(7,Math.min(10,camera.position.z+event.deltaY*.003));
});

const TOTAL_SHEETS=4;
let currentSheet=0;
let pageDragging=false;
let draggedSheet=null;
let dragStartX=0;
let dragProgress=0;
let pageAnimating=false;

const readingBook=new THREE.Group();
readingBook.visible=false;
scene.add(readingBook);

const BOOK_WIDTH=7.2;
const BOOK_HEIGHT=5;
const HALF_WIDTH=BOOK_WIDTH/2;
const SEGMENTS=24;
const PAGE_THICKNESS=.02;
const textureLoader=new THREE.TextureLoader();
const pageTextures=[];

for(let i=0;i<8;i++){
const texture=textureLoader.load(`img/book/page${i+1}.jpg`);
texture.colorSpace=THREE.SRGBColorSpace;
texture.anisotropy=renderer.capabilities.getMaxAnisotropy();
texture.wrapS=THREE.ClampToEdgeWrapping;
texture.wrapT=THREE.ClampToEdgeWrapping;
pageTextures.push(texture);
}

const sideMaterial=new THREE.MeshStandardMaterial({
color:0xe3dbc3,
roughness:1,
metalness:0,
side:THREE.DoubleSide
});

function createFaceMaterial(index,mirror=false){
const map=pageTextures[Math.max(0,Math.min(7,index))].clone();

map.colorSpace=THREE.SRGBColorSpace;
map.wrapS=THREE.RepeatWrapping;
map.wrapT=THREE.ClampToEdgeWrapping;

if(mirror){
map.repeat.set(-1,1);
map.offset.set(1,0);
}else{
map.repeat.set(1,1);
map.offset.set(0,0);
}

map.needsUpdate=true;

return new THREE.MeshStandardMaterial({
map,
roughness:.9,
metalness:0,
side:THREE.DoubleSide
});
}

function createPageGeometry(){
const width=HALF_WIDTH;
const height=BOOK_HEIGHT;
const depth=PAGE_THICKNESS;
const vertices=[];
const uvs=[];
const indices=[];
const rows=8;
const cols=SEGMENTS;

for(let side=0;side<2;side++){
const z=side===0?-depth/2:depth/2;

for(let y=0;y<=rows;y++){
for(let x=0;x<=cols;x++){
vertices.push(width*x/cols,-height/2+height*y/rows,z);
uvs.push(x/cols,y/rows);
}
}
}

const layerSize=(cols+1)*(rows+1);

function addFrontIndices(){
for(let y=0;y<rows;y++){
for(let x=0;x<cols;x++){
const a=y*(cols+1)+x;
const b=a+1;
const c=a+cols+1;
const d=c+1;
indices.push(a,b,d,a,d,c);
}
}
}

function addBackIndices(){
for(let y=0;y<rows;y++){
for(let x=0;x<cols;x++){
const a=layerSize+y*(cols+1)+x;
const b=a+1;
const c=a+cols+1;
const d=c+1;
indices.push(a,d,b,a,c,d);
}
}
}

addFrontIndices();
addBackIndices();

for(let y=0;y<rows;y++){
const f1=y*(cols+1);
const f2=(y+1)*(cols+1);
const b1=layerSize+f1;
const b2=layerSize+f2;
indices.push(f1,b1,b2,f1,b2,f2);

const r1=y*(cols+1)+cols;
const r2=(y+1)*(cols+1)+cols;
const br1=layerSize+r1;
const br2=layerSize+r2;
indices.push(r1,r2,br2,r1,br2,br1);
}

for(let x=0;x<cols;x++){
const f1=x;
const f2=x+1;
const b1=layerSize+f1;
const b2=layerSize+f2;
indices.push(f1,f2,b2,f1,b2,b1);

const t1=rows*(cols+1)+x;
const t2=t1+1;
const bt1=layerSize+t1;
const bt2=layerSize+t2;
indices.push(t1,bt1,bt2,t1,bt2,t2);
}

const geometry=new THREE.BufferGeometry();
geometry.setAttribute("position",new THREE.Float32BufferAttribute(vertices,3));
geometry.setAttribute("uv",new THREE.Float32BufferAttribute(uvs,2));
geometry.setIndex(indices);

const frontCount=SEGMENTS*rows*6;
const backCount=frontCount;
const sideCount=indices.length-frontCount-backCount;

geometry.clearGroups();
geometry.addGroup(0,frontCount,0);
geometry.addGroup(frontCount,backCount,1);
geometry.addGroup(frontCount+backCount,sideCount,2);

geometry.computeVertexNormals();
geometry.userData.originalPositions=[];

const position=geometry.attributes.position;

for(let i=0;i<position.count;i++){
geometry.userData.originalPositions.push([
position.getX(i),
position.getY(i),
position.getZ(i)
]);
}

return geometry;
}

function createSheet(index){
const group=new THREE.Group();

const leftIndex=index*2;
const rightIndex=index*2+1;

const leftBackIndex=Math.min(7,leftIndex+1);
const rightBackIndex=Math.min(7,rightIndex+1);

const leftPage=new THREE.Mesh(
createPageGeometry(),
[
createFaceMaterial(leftIndex,true),
createFaceMaterial(leftBackIndex,false),
sideMaterial
]
);

const rightPage=new THREE.Mesh(
createPageGeometry(),
[
createFaceMaterial(rightIndex,false),
createFaceMaterial(rightBackIndex,true),
sideMaterial
]
);

leftPage.rotation.y=Math.PI;

group.add(rightPage,leftPage);
group.userData.index=index;
group.userData.rightPage=rightPage;
group.userData.leftPage=leftPage;

return group;
}

const sheets=[];

for(let i=0;i<TOTAL_SHEETS;i++){
const sheet=createSheet(i);
sheets.push(sheet);
readingBook.add(sheet);
}

function updatePageGeometry(mesh,angle){
const geometry=mesh.geometry;
const position=geometry.attributes.position;
const original=geometry.userData.originalPositions;
const bend=Math.sin(Math.abs(angle));

for(let i=0;i<position.count;i++){
const ox=original[i][0];
const oy=original[i][1];
const oz=original[i][2];
const t=ox/HALF_WIDTH;
const curve=Math.sin(t*Math.PI)*bend*.55;
const localAngle=angle*t*.24;

position.setXYZ(
i,
ox*Math.cos(localAngle)-oz*Math.sin(localAngle),
oy,
ox*Math.sin(localAngle)+oz*Math.cos(localAngle)+curve
);
}

position.needsUpdate=true;
geometry.computeVertexNormals();
}

function resetPageGeometry(mesh){
const position=mesh.geometry.attributes.position;
const original=mesh.geometry.userData.originalPositions;

for(let i=0;i<position.count;i++){
position.setXYZ(i,original[i][0],original[i][1],original[i][2]);
}

position.needsUpdate=true;
mesh.geometry.computeVertexNormals();
}

function setPageLayer(mesh,order){
mesh.renderOrder=order;

mesh.material.forEach(material=>{
material.depthTest=true;
material.depthWrite=true;
});
}

function hideAllPages(){
sheets.forEach(sheet=>{
sheet.visible=false;
sheet.userData.rightPage.visible=false;
sheet.userData.leftPage.visible=false;
});
}

function resetBook(){
currentSheet=0;
pageDragging=false;
draggedSheet=null;
dragProgress=0;
pageAnimating=false;

sheets.forEach(sheet=>{
sheet.position.set(0,1,0);
sheet.rotation.set(0,0,0);
sheet.renderOrder=0;

const right=sheet.userData.rightPage;
const left=sheet.userData.leftPage;

resetPageGeometry(right);
resetPageGeometry(left);

right.position.set(0,0,0);
left.position.set(0,0,0);
right.rotation.y=0;
left.rotation.y=Math.PI;

setPageLayer(right,0);
setPageLayer(left,0);
});

updatePageVisibility();
updatePageCounter();
}

function updatePageVisibility(){
hideAllPages();

const current=sheets[currentSheet];
current.visible=true;
current.userData.leftPage.visible=true;
current.userData.rightPage.visible=true;
}

function showSheetBehind(sheet,order){
if(!sheet)return;

sheet.visible=true;
sheet.position.z=0;

const right=sheet.userData.rightPage;
const left=sheet.userData.leftPage;

right.visible=true;
left.visible=true;

setPageLayer(left,order);
setPageLayer(right,order+1);
}

function preparePageTurn(direction){
hideAllPages();

const current=sheets[currentSheet];
current.visible=true;
current.position.z=.08;
current.userData.leftPage.visible=true;
current.userData.rightPage.visible=true;

if(direction===1){
const next=sheets[currentSheet+1];

setPageLayer(current.userData.leftPage,1);
setPageLayer(current.userData.rightPage,20);
showSheetBehind(next,5);
}else{
const previous=sheets[currentSheet-1];

setPageLayer(current.userData.rightPage,1);
setPageLayer(current.userData.leftPage,20);
showSheetBehind(previous,5);
}
}

function updatePageCounter(){
pageCounter.textContent=String(currentSheet+1).padStart(2,"0")+" / "+String(TOTAL_SHEETS).padStart(2,"0");
}

function startPageDrag(event){
if(!window.readingMode||pageAnimating||pageDragging)return;

const rect=renderer.domElement.getBoundingClientRect();
const x=event.clientX-rect.left;
const y=event.clientY-rect.top;

if(y>=rect.height*.38)return;

const fromRight=x>rect.width*.58;
const fromLeft=x<rect.width*.42;

if(!fromRight&&!fromLeft)return;

let direction;

if(fromLeft){
if(currentSheet<=0)return;
direction=-1;
}else{
if(currentSheet>=TOTAL_SHEETS-1)return;
direction=1;
}

preparePageTurn(direction);
draggedSheet=sheets[currentSheet];
dragStartX=x;
pageDragging=true;
dragProgress=0;
event.preventDefault();
}

function movePageDrag(event){
if(!pageDragging||!draggedSheet)return;

const rect=renderer.domElement.getBoundingClientRect();
const x=event.clientX-rect.left;
const direction=dragStartX>rect.width*.5?1:-1;
const maxMovement=rect.width*.65;

let movement=(dragStartX-x)*direction;
movement=Math.max(0,Math.min(maxMovement,movement));
dragProgress=movement/maxMovement;

updateDraggedPage(dragProgress,direction);
event.preventDefault();
}

function updateDraggedPage(progress,direction){
if(!draggedSheet)return;

const angle=Math.max(0,Math.min(1,progress))*Math.PI;
const right=draggedSheet.userData.rightPage;
const left=draggedSheet.userData.leftPage;

/* La hoja cambia de capa al superar la mitad del giro,
   evitando que reaparezca bruscamente al finalizar. */
const turningLayer=progress<.5?20:2;

if(direction===1){
setPageLayer(right,turningLayer);
right.rotation.y=-angle;
updatePageGeometry(right,angle);
}else{
setPageLayer(left,turningLayer);
left.rotation.y=Math.PI+angle;
updatePageGeometry(left,angle);
}
}

function endPageDrag(){
if(!pageDragging||!draggedSheet)return;

const sheet=draggedSheet;
const progress=dragProgress;
const direction=dragStartX>renderer.domElement.clientWidth*.5?1:-1;

pageDragging=false;
draggedSheet=null;
animatePage(sheet,direction,progress>.5);
}

function animatePage(sheet,direction,complete){
pageAnimating=true;

const start=dragProgress;
const target=complete?1:0;
const duration=complete?460:300;
const startTime=performance.now();

function animationFrame(now){
const raw=Math.min(1,(now-startTime)/duration);
const eased=1-Math.pow(1-raw,3);
const progress=start+(target-start)*eased;

draggedSheet=sheet;
updateDraggedPage(progress,direction);

if(raw<1){
requestAnimationFrame(animationFrame);
return;
}

draggedSheet=null;

if(complete&&direction===1){
currentSheet=Math.min(TOTAL_SHEETS-1,currentSheet+1);
}

if(complete&&direction===-1){
currentSheet=Math.max(0,currentSheet-1);
}

resetAfterTurn();
}

requestAnimationFrame(animationFrame);
}

function resetAfterTurn(){
sheets.forEach(sheet=>{
sheet.position.z=0;
sheet.renderOrder=0;

const right=sheet.userData.rightPage;
const left=sheet.userData.leftPage;

resetPageGeometry(right);
resetPageGeometry(left);

right.position.set(0,0,0);
left.position.set(0,0,0);
right.rotation.y=0;
left.rotation.y=Math.PI;

setPageLayer(right,0);
setPageLayer(left,0);
});

updatePageVisibility();
updatePageCounter();
pageAnimating=false;
}

renderer.domElement.addEventListener("pointerdown",startPageDrag);
window.addEventListener("pointermove",movePageDrag);
window.addEventListener("pointerup",endPageDrag);

openBookButton.addEventListener("click",()=>{
if(window.readingMode)return;

window.readingMode=true;
if(window.model)window.model.visible=false;

document.querySelector(".axis-gizmo").style.display="none";
document.querySelector(".model-label").style.display="none";
document.querySelector(".rotate-label").style.display="none";
document.querySelector(".buy-button").style.display="none";

openBookButton.style.display="none";
exitReadingButton.style.display="flex";
readingUI.style.display="block";
readingBook.visible=true;

resetBook();
});

exitReadingButton.addEventListener("click",()=>{
window.readingMode=false;
readingBook.visible=false;
if(window.model)window.model.visible=true;

document.querySelector(".axis-gizmo").style.display="block";
document.querySelector(".model-label").style.display="block";
document.querySelector(".rotate-label").style.display="block";
document.querySelector(".buy-button").style.display="inline-flex";

exitReadingButton.style.display="none";
openBookButton.style.display="flex";
readingUI.style.display="none";
});

openBookButton.style.display="flex";
exitReadingButton.style.display="none";

function updateAxisGizmo(){
if(!window.model)return;

const axes={
x:new THREE.Vector3(1,0,0),
y:new THREE.Vector3(0,1,0),
z:new THREE.Vector3(0,0,1)
};

const quaternion=window.model.quaternion;

axes.x.applyQuaternion(quaternion);
axes.y.applyQuaternion(quaternion);
axes.z.applyQuaternion(quaternion);

const getAngle=vector=>Math.atan2(vector.y,vector.x)*180/Math.PI;

axisX.style.transform=`rotate(${getAngle(axes.x)}deg)`;
axisY.style.transform=`rotate(${getAngle(axes.y)}deg)`;
axisZ.style.transform=`rotate(${getAngle(axes.z)}deg)`;
}

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

function animate(){
requestAnimationFrame(animate);
updateAxisGizmo();
renderer.render(scene,camera);
}

animate();
</script>

<script>
document.addEventListener("wheel",event=>{
if(event.ctrlKey)event.preventDefault();
},{passive:false});

document.addEventListener("keydown",event=>{
if(event.ctrlKey&&["+","-","=","0"].includes(event.key))event.preventDefault();
});
</script>
