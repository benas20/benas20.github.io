<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;caret-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1f1d17;color:#d8cfae;font-family:"Courier New",monospace}
#background{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:saturate(.75) contrast(.95)}
#scene{position:fixed;inset:0;z-index:2}
.overlay,.grain{position:fixed;inset:0;pointer-events:none}
.overlay{z-index:3}
.system-header{position:absolute;top:0;left:0;width:100%;height:34px;padding:0 24px;display:flex;justify-content:space-between;align-items:center;color:#650015;font-size:11px;letter-spacing:2px;border-bottom:1px solid #d8cfae33;background:#1f1d1780;backdrop-filter:blur(5px)}
.axis-gizmo{position:absolute;top:58px;right:30px;width:90px;height:90px;color:#650015;opacity:.8}
.axis-center{position:absolute;left:39px;top:39px;width:7px;height:7px;border-radius:50%;background:#650015}
.axis-line{position:absolute;left:42px;top:42px;height:1px;background:#650015;transform-origin:left center}
.axis-line span{position:absolute;font-size:8px;font-weight:bold;letter-spacing:1px}
.axis-x{width:36px}.axis-x span{right:-11px;top:-5px}
.axis-y{width:34px}.axis-y span{right:-9px;top:-5px}
.axis-z{width:30px}.axis-z span{right:-10px;top:-5px}
.axis-caption{position:absolute;left:0;bottom:-4px;width:100%;text-align:center;font-size:6px;letter-spacing:1.5px;opacity:.65}

.buy-button{position:absolute;left:50%;top:90%;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:12px;padding:12px 18px;transition:.25s}
.buy-button::after{content:"→";transition:.25s}
.buy-button:hover,.open-book-button:hover,.exit-reading-button:hover{color:#fff;background:#650015;box-shadow:4px 5px 0 #65001533}
.buy-button:hover{transform:translate(-50%,-50%) translateY(-2px)}
.buy-button:hover::after{transform:translateX(4px)}
.back{position:absolute;left:28px;top:55px;color:#650015;text-decoration:none;font-size:7px;letter-spacing:2px;pointer-events:auto}
.grain{z-index:10;opacity:.08;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");mix-blend-mode:screen}
.open-book-button,.exit-reading-button{position:absolute;left:50%;transform:translateX(-50%);display:none;align-items:center;justify-content:center;padding:12px 18px;transition:.25s}
.open-book-button{top:82%}.exit-reading-button{top:90%}
.open-book-button::after{content:"→";margin-left:12px}.exit-reading-button::before{content:"←";margin-right:12px}
.open-book-button:hover,.exit-reading-button:hover{transform:translateX(-50%) translateY(-2px)}
.reading-ui{position:fixed;inset:0;z-index:8;display:none;pointer-events:none}
.reading-label,.reading-hint{position:absolute;left:50%;transform:translateX(-50%);color:#650015;white-space:nowrap}
.reading-label{top:7%;font-size:8px;letter-spacing:2px}
.reading-hint{bottom:5%;font-size:7px;letter-spacing:1.5px;opacity:.75}
.page-counter{position:absolute;right:28px;bottom:30px;color:#650015;font-size:7px;letter-spacing:2px}
@media(max-width:768px){
.system-header{height:32px;padding:0 16px;font-size:9px;letter-spacing:1.5px}.back{left:16px;top:48px}
.axis-gizmo{top:48px;right:16px;transform:scale(.85);transform-origin:top right}
.model-label{left:16px;bottom:22px;font-size:8px}.rotate-label{right:16px;bottom:22px;font-size:8px}
.buy-button{top:86%;padding:11px 15px;font-size:8px}.open-book-button,.exit-reading-button{padding:11px 15px;font-size:8px}
}
@media(max-width:480px){
html,body{touch-action:none}.system-header{padding:0 10px;font-size:7px}.back{left:12px;top:45px;font-size:6px}
.axis-gizmo{top:45px;right:10px;transform:scale(.7)}.model-label,.rotate-label{bottom:72px;font-size:6px}
.model-label{left:10px}.rotate-label{right:10px}.buy-button{top:91%;padding:10px 13px;font-size:7px}
.open-book-button{top:84%;padding:10px 13px;font-size:7px}.exit-reading-button{top:91%;padding:10px 13px;font-size:7px}
.reading-label{top:8%;font-size:6px}.reading-hint{bottom:4%;font-size:6px}.page-counter{right:10px;bottom:72px;font-size:6px}
}
@media(max-width:768px) and (orientation:landscape){
.buy-button{top:82%}.open-book-button{top:78%}.exit-reading-button{top:88%}
.model-label,.rotate-label{bottom:16px}.axis-gizmo{top:42px}
}
</style>

<body>
<video id="background" autoplay muted loop playsinline>
<source src="videos/sphereroom.mp4" type="video/mp4">
</video>

<div id="scene"></div>

<div class="overlay">
<div class="system-header"><span>dontfollowmecauseimlosttoo</span></div>
<a class="back" href="dontfollowmecauseimlosttoo.html">← BACK TO GALERY</a>
<div class="axis-gizmo">
<div class="axis-center"></div><div class="axis-line axis-x"><span>X</span></div>
<div class="axis-line axis-y"><span>Y</span></div><div class="axis-line axis-z"><span>Z</span></div>
<div class="axis-caption">360° OBJECT</div>
</div>

</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from "three";
import {FBXLoader} from "three/addons/loaders/FBXLoader.js";

const container=document.getElementById("scene");
const axisX=document.querySelector(".axis-x");
const axisY=document.querySelector(".axis-y");
const axisZ=document.querySelector(".axis-z");
const openBookButton=document.getElementById("openBookButton");
const exitReadingButton=document.getElementById("exitReadingButton");
const readingUI=document.getElementById("readingUI");
const pageCounter=document.getElementById("pageCounter");

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,.1,1000);
camera.position.set(0,1.2,11);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,2));

const keyLight=new THREE.DirectionalLight(0xffffff,3);
keyLight.position.set(4,6,5);
scene.add(keyLight);

const fillLight=new THREE.DirectionalLight(0x9fa99b,1.5);
fillLight.position.set(-4,2,-3);
scene.add(fillLight);

const fbxLoader=new FBXLoader();

fbxLoader.load("models/book.fbx",object=>{
object.traverse(child=>{
if(child.isMesh){child.castShadow=true;child.receiveShadow=true}
});
const box=new THREE.Box3().setFromObject(object);
const center=box.getCenter(new THREE.Vector3());
const size=box.getSize(new THREE.Vector3());
object.position.sub(center);
object.position.y+=1;
object.scale.setScalar(3/Math.max(size.x,size.y,size.z));
scene.add(object);
window.model=object;
},undefined,error=>console.error("Error cargando FBX:",error));

let dragging=false,previousX=0,previousY=0;

container.addEventListener("pointerdown",e=>{
if(window.readingMode)return;
dragging=true;previousX=e.clientX;previousY=e.clientY;
});

window.addEventListener("pointerup",()=>dragging=false);

window.addEventListener("pointermove",e=>{
if(!dragging||!window.model||window.readingMode)return;
window.model.rotation.y+=(e.clientX-previousX)*.01;
window.model.rotation.x+=(e.clientY-previousY)*.01;
previousX=e.clientX;previousY=e.clientY;
});

window.addEventListener("wheel",e=>{
if(window.readingMode)return;
camera.position.z=Math.max(7,Math.min(10,camera.position.z+e.deltaY*.003));
});

const TOTAL_SHEETS=4;
let currentSheet=0,pageDragging=false,draggedSheet=null,dragStartX=0,dragProgress=0,pageAnimating=false;

const readingBook=new THREE.Group();
readingBook.visible=false;
scene.add(readingBook);

const BOOK_WIDTH=7.2;
const BOOK_HEIGHT=5;
const HALF_WIDTH=BOOK_WIDTH/2;
const SEGMENTS=24;
const PAGE_THICKNESS=.02;

const textureLoader=new THREE.TextureLoader();
const pageMaterials=[];

for(let i=0;i<8;i++){
const texture=textureLoader.load(`img/book/page${i+1}.jpg`);
texture.colorSpace=THREE.SRGBColorSpace;
texture.anisotropy=renderer.capabilities.getMaxAnisotropy();
pageMaterials.push(new THREE.MeshStandardMaterial({
map:texture,roughness:.9,metalness:0,side:THREE.DoubleSide
}));
}

const pageEdgeMaterial=new THREE.MeshStandardMaterial({
color:0xc8c0a7,roughness:1,metalness:0,side:THREE.DoubleSide
});

function createPageGeometry(){
const width=HALF_WIDTH,height=BOOK_HEIGHT,depth=PAGE_THICKNESS;
const vertices=[],uvs=[],indices=[];
const rows=8,cols=SEGMENTS;

for(let side=0;side<2;side++){
const z=side===0?-depth/2:depth/2;
for(let y=0;y<=rows;y++){
for(let x=0;x<=cols;x++){
vertices.push(width*(x/cols),-height/2+height*(y/rows),z);
uvs.push(x/cols,y/rows);
}
}
}

const layerSize=(cols+1)*(rows+1);

for(let y=0;y<rows;y++){
for(let x=0;x<cols;x++){
const a=y*(cols+1)+x,b=a+1,c=a+cols+1,d=c+1;
indices.push(a,b,d,a,d,c);
const aa=layerSize+a,bb=layerSize+b,cc=layerSize+c,dd=layerSize+d;
indices.push(aa,dd,bb,aa,cc,dd);
}
}

for(let y=0;y<rows;y++){
const f1=y*(cols+1),f2=(y+1)*(cols+1),b1=layerSize+f1,b2=layerSize+f2;
indices.push(f1,b1,b2,f1,b2,f2);
const r1=y*(cols+1)+cols,r2=(y+1)*(cols+1)+cols,br1=layerSize+r1,br2=layerSize+r2;
indices.push(r1,r2,br2,r1,br2,br1);
}

for(let x=0;x<cols;x++){
const f1=x,f2=x+1,b1=layerSize+f1,b2=layerSize+f2;
indices.push(f1,f2,b2,f1,b2,b1);
const t1=rows*(cols+1)+x,t2=t1+1,bt1=layerSize+t1,bt2=layerSize+t2;
indices.push(t1,bt1,bt2,t1,bt2,t2);
}

const geometry=new THREE.BufferGeometry();
geometry.setAttribute("position",new THREE.Float32BufferAttribute(vertices,3));
geometry.setAttribute("uv",new THREE.Float32BufferAttribute(uvs,2));
geometry.setIndex(indices);
geometry.computeVertexNormals();
storeOriginalGeometry(geometry);
return geometry;
}

function storeOriginalGeometry(geometry){
const position=geometry.attributes.position;
geometry.userData.originalPositions=[];
for(let i=0;i<position.count;i++){
geometry.userData.originalPositions.push([position.getX(i),position.getY(i),position.getZ(i)]);
}
}

function updatePageGeometry(mesh,angle){
const geometry=mesh.geometry;
const position=geometry.attributes.position;
const original=geometry.userData.originalPositions;
const bend=Math.sin(Math.abs(angle));

for(let i=0;i<position.count;i++){
const ox=original[i][0],oy=original[i][1],oz=original[i][2];
const t=ox/HALF_WIDTH;
const curve=Math.sin(t*Math.PI)*bend*.55;
const localAngle=angle*t*.24;
const x=ox*Math.cos(localAngle)-oz*Math.sin(localAngle);
const z=ox*Math.sin(localAngle)+oz*Math.cos(localAngle)+curve;
position.setXYZ(i,x,oy,z);
}

position.needsUpdate=true;
geometry.computeVertexNormals();
}

function resetPageGeometry(mesh){
const position=mesh.geometry.attributes.position;
const original=mesh.geometry.userData.originalPositions;
for(let i=0;i<position.count;i++){
position.setXYZ(i,original[i][0],original[i][1],original[i][2]);
}
position.needsUpdate=true;
mesh.geometry.computeVertexNormals();
}

function createSheet(index){
const group=new THREE.Group();
const rightPage=new THREE.Mesh(createPageGeometry(),pageMaterials[index*2]);
const leftPage=new THREE.Mesh(createPageGeometry(),pageMaterials[index*2+1]);

rightPage.rotation.y=0;
leftPage.rotation.y=Math.PI;

group.add(rightPage,leftPage);
group.userData.index=index;
group.userData.rightPage=rightPage;
group.userData.leftPage=leftPage;

return group;
}

const sheets=[];

for(let i=0;i<TOTAL_SHEETS;i++){
const sheet=createSheet(i);
sheets.push(sheet);
readingBook.add(sheet);
}

function resetBook(){
currentSheet=0;
pageDragging=false;
draggedSheet=null;
dragProgress=0;
pageAnimating=false;

sheets.forEach((sheet,index)=>{
sheet.visible=true;
sheet.position.set(0,1,0);
sheet.rotation.set(0,0,0);

const right=sheet.userData.rightPage;
const left=sheet.userData.leftPage;

resetPageGeometry(right);
resetPageGeometry(left);
right.position.set(0,0,0);
left.position.set(0,0,0);
right.rotation.y=0;
left.rotation.y=Math.PI;
right.visible=true;
left.visible=true;
});

updatePageVisibility();
updatePageCounter();
}

function updatePageVisibility(){
sheets.forEach((sheet,index)=>{
sheet.position.x=index<currentSheet?-.008*index:.008*index;
sheet.position.z=index<currentSheet?-.006*index:.006*index;
sheet.userData.rightPage.visible=true;
sheet.userData.leftPage.visible=true;
});
}

function updatePageCounter(){
pageCounter.textContent=String(currentSheet+1).padStart(2,"0")+" / "+String(TOTAL_SHEETS).padStart(2,"0");
}

function startPageDrag(event){
if(!window.readingMode||pageAnimating||pageDragging)return;

const rect=renderer.domElement.getBoundingClientRect();
const x=event.clientX-rect.left;
const y=event.clientY-rect.top;

if(y>=rect.height*.38)return;

const fromRight=x>rect.width*.58;
const fromLeft=x<rect.width*.42;
if(!fromRight&&!fromLeft)return;

if(fromLeft){
if(currentSheet<=0)return;
draggedSheet=sheets[currentSheet-1];
}else{
if(currentSheet>=TOTAL_SHEETS-1)return;
draggedSheet=sheets[currentSheet];
}

dragStartX=x;
pageDragging=true;
dragProgress=0;
draggedSheet.renderOrder=100;
event.preventDefault();
}

function movePageDrag(event){
if(!pageDragging||!draggedSheet)return;

const rect=renderer.domElement.getBoundingClientRect();
const x=event.clientX-rect.left;
const direction=dragStartX>rect.width*.5?1:-1;
const maxMovement=rect.width*.65;

let movement=(dragStartX-x)*direction;
movement=Math.max(0,Math.min(maxMovement,movement));
dragProgress=movement/maxMovement;

updateDraggedPage(dragProgress,direction);
event.preventDefault();
}

function updateDraggedPage(progress,direction){
if(!draggedSheet)return;

const angle=Math.max(0,Math.min(1,progress))*Math.PI;
const right=draggedSheet.userData.rightPage;
const left=draggedSheet.userData.leftPage;

if(direction===1){
right.rotation.y=-angle;
updatePageGeometry(right,angle);
}else{
left.rotation.y=Math.PI+angle;
updatePageGeometry(left,angle);
}
}

function endPageDrag(){
if(!pageDragging||!draggedSheet)return;

const sheet=draggedSheet;
const progress=dragProgress;
const direction=dragStartX>renderer.domElement.clientWidth*.5?1:-1;

pageDragging=false;
draggedSheet=null;
animatePage(sheet,direction,progress>.5);
}

function animatePage(sheet,direction,complete){
pageAnimating=true;

const start=dragProgress;
const target=complete?1:0;
const duration=complete?460:300;
const startTime=performance.now();

function animationFrame(now){
const raw=Math.min(1,(now-startTime)/duration);
const eased=1-Math.pow(1-raw,3);
const progress=start+(target-start)*eased;

draggedSheet=sheet;
updateDraggedPage(progress,direction);

if(raw<1){
requestAnimationFrame(animationFrame);
return;
}

draggedSheet=null;

if(complete&&direction===1)currentSheet=Math.min(TOTAL_SHEETS-1,currentSheet+1);
if(complete&&direction===-1)currentSheet=Math.max(0,currentSheet-1);

resetAfterTurn();
}

requestAnimationFrame(animationFrame);
}

function resetAfterTurn(){
sheets.forEach((sheet,index)=>{
sheet.renderOrder=0;

const right=sheet.userData.rightPage;
const left=sheet.userData.leftPage;

resetPageGeometry(right);
resetPageGeometry(left);
right.position.set(0,0,0);
left.position.set(0,0,0);

if(index<currentSheet){
right.rotation.y=-Math.PI;
left.rotation.y=Math.PI;
}else{
right.rotation.y=0;
left.rotation.y=Math.PI;
}

right.visible=true;
left.visible=true;
});

updatePageVisibility();
updatePageCounter();
pageAnimating=false;
}

renderer.domElement.addEventListener("pointerdown",startPageDrag);
window.addEventListener("pointermove",movePageDrag);
window.addEventListener("pointerup",endPageDrag);

openBookButton.addEventListener("click",()=>{
if(window.readingMode)return;

window.readingMode=true;
if(window.model)window.model.visible=false;

document.querySelector(".axis-gizmo").style.display="none";
document.querySelector(".model-label").style.display="none";
document.querySelector(".rotate-label").style.display="none";
document.querySelector(".buy-button").style.display="none";

openBookButton.style.display="none";
exitReadingButton.style.display="flex";
readingUI.style.display="block";
readingBook.visible=true;
resetBook();
});

exitReadingButton.addEventListener("click",()=>{
window.readingMode=false;
readingBook.visible=false;
if(window.model)window.model.visible=true;

document.querySelector(".axis-gizmo").style.display="block";
document.querySelector(".model-label").style.display="block";
document.querySelector(".rotate-label").style.display="block";
document.querySelector(".buy-button").style.display="inline-flex";

exitReadingButton.style.display="none";
openBookButton.style.display="flex";
readingUI.style.display="none";
});

openBookButton.style.display="flex";
exitReadingButton.style.display="none";

function updateAxisGizmo(){
if(!window.model)return;

const axes={
x:new THREE.Vector3(1,0,0),
y:new THREE.Vector3(0,1,0),
z:new THREE.Vector3(0,0,1)
};

const quaternion=window.model.quaternion;
axes.x.applyQuaternion(quaternion);
axes.y.applyQuaternion(quaternion);
axes.z.applyQuaternion(quaternion);

const getAngle=vector=>Math.atan2(vector.y,vector.x)*180/Math.PI;
axisX.style.transform=`rotate(${getAngle(axes.x)}deg)`;
axisY.style.transform=`rotate(${getAngle(axes.y)}deg)`;
axisZ.style.transform=`rotate(${getAngle(axes.z)}deg)`;
}

window.addEventListener("resize",()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

function animate(){
requestAnimationFrame(animate);
updateAxisGizmo();
renderer.render(scene,camera);
}

animate();
</script>

<script>
document.addEventListener("wheel",e=>{
if(e.ctrlKey)e.preventDefault();
},{passive:false});

document.addEventListener("keydown",e=>{
if(e.ctrlKey&&["+","-","=","0"].includes(e.key))e.preventDefault();
});
</script>
