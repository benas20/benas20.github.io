<script type="module">
import * as THREE from "three";
import {FBXLoader} from "three/addons/loaders/FBXLoader.js";

/* ELEMENTOS ORIGINALES */

const container=document.getElementById("scene");
const axisX=document.querySelector(".axis-x");
const axisY=document.querySelector(".axis-y");
const axisZ=document.querySelector(".axis-z");
const openBookButton=document.getElementById("openBookButton");
const exitReadingButton=document.getElementById("exitReadingButton");
const readingUI=document.getElementById("readingUI");
const pageCounter=document.getElementById("pageCounter");

/* ESCENA */

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,.1,1000);
camera.position.set(0,1.2,11);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

/* LUCES */

scene.add(new THREE.AmbientLight(0xffffff,2));

const keyLight=new THREE.DirectionalLight(0xffffff,3);
keyLight.position.set(4,6,5);
scene.add(keyLight);

const fillLight=new THREE.DirectionalLight(0x9fa99b,1.5);
fillLight.position.set(-4,2,-3);
scene.add(fillLight);

/* LIBRO FBX */

const loader=new FBXLoader();

loader.load("models/book.fbx",object=>{
    object.traverse(child=>{
        if(child.isMesh){
            child.castShadow=true;
            child.receiveShadow=true;
        }
    });

    const box=new THREE.Box3().setFromObject(object);
    const center=box.getCenter(new THREE.Vector3());
    const size=box.getSize(new THREE.Vector3());

    object.position.sub(center);
    object.position.y+=1;

    const maxSize=Math.max(size.x,size.y,size.z);
    object.scale.setScalar(3/maxSize);

    scene.add(object);
    window.model=object;
},undefined,error=>{
    console.error("Error cargando FBX:",error);
});

/* ROTACION ORIGINAL */

let dragging=false;
let previousX=0;
let previousY=0;

container.addEventListener("pointerdown",e=>{
    if(window.readingMode)return;
    dragging=true;
    previousX=e.clientX;
    previousY=e.clientY;
});

window.addEventListener("pointerup",()=>{dragging=false});

window.addEventListener("pointermove",e=>{
    if(!dragging||!window.model||window.readingMode)return;

    const dx=e.clientX-previousX;
    const dy=e.clientY-previousY;

    window.model.rotation.y+=dx*.01;
    window.model.rotation.x+=dy*.01;

    previousX=e.clientX;
    previousY=e.clientY;
});

/* ZOOM ORIGINAL */

window.addEventListener("wheel",e=>{
    if(window.readingMode)return;

    camera.position.z+=e.deltaY*.003;
    camera.position.z=Math.max(7,Math.min(10,camera.position.z));
});

/* SISTEMA DE PAGINAS */

const TOTAL_SHEETS=4;
let currentSheet=0;
let pageDragging=false;
let draggedSheet=null;
let dragStartX=0;
let dragStartY=0;
let dragProgress=0;
let pageAnimating=false;

/* GRUPO DEL LIBRO */

const readingBook=new THREE.Group();
readingBook.visible=false;
scene.add(readingBook);

/* DIMENSIONES */

const BOOK_WIDTH=7.2;
const BOOK_HEIGHT=5;
const HALF_WIDTH=BOOK_WIDTH/2;
const SEGMENTS=24;
const PAGE_THICKNESS=.02;

/* MATERIALES DE PAGINA */

const textureLoader=new THREE.TextureLoader();
const pageMaterials=[];

for(let i=1;i<=8;i++){
    const texture=textureLoader.load(`img/book/page${i}.jpg`);
    texture.colorSpace=THREE.SRGBColorSpace;
    texture.anisotropy=renderer.capabilities.getMaxAnisotropy();

    pageMaterials.push(new THREE.MeshStandardMaterial({
        map:texture,
        roughness:.9,
        metalness:0,
        side:THREE.DoubleSide
    }));
}

/* MATERIAL DEL BORDE */

const pageEdgeMaterial=new THREE.MeshStandardMaterial({
    color:0xc8c0a7,
    roughness:1,
    metalness:0,
    side:THREE.DoubleSide
});

/* CREAR GEOMETRIA DE PAGINA CON GROSOR */

function createPageGeometry(){
    const width=HALF_WIDTH;
    const height=BOOK_HEIGHT;
    const depth=PAGE_THICKNESS;
    const vertices=[];
    const indices=[];
    const rows=8;
    const cols=SEGMENTS;

    for(let side=0;side<2;side++){
        const z=side===0?-depth/2:depth/2;

        for(let y=0;y<=rows;y++){
            const py=-height/2+height*(y/rows);

            for(let x=0;x<=cols;x++){
                vertices.push(width*(x/cols),py,z);
            }
        }
    }

    const layerSize=(cols+1)*(rows+1);

    for(let y=0;y<rows;y++){
        for(let x=0;x<cols;x++){
            const a=y*(cols+1)+x;
            const b=a+1;
            const c=a+(cols+1);
            const d=c+1;

            indices.push(a,b,d,a,d,c);

            const aa=layerSize+a;
            const bb=layerSize+b;
            const cc=layerSize+c;
            const dd=layerSize+d;

            indices.push(aa,dd,bb,aa,cc,dd);
        }
    }

    for(let y=0;y<rows;y++){
        const f1=y*(cols+1);
        const f2=(y+1)*(cols+1);
        const b1=layerSize+f1;
        const b2=layerSize+f2;
        indices.push(f1,b1,b2,f1,b2,f2);
    }

    for(let y=0;y<rows;y++){
        const f1=y*(cols+1)+cols;
        const f2=(y+1)*(cols+1)+cols;
        const b1=layerSize+f1;
        const b2=layerSize+f2;
        indices.push(f1,f2,b2,f1,b2,b1);
    }

    for(let x=0;x<cols;x++){
        const f1=x;
        const f2=x+1;
        const b1=layerSize+f1;
        const b2=layerSize+f2;
        indices.push(f1,f2,b2,f1,b2,b1);
    }

    for(let x=0;x<cols;x++){
        const f1=rows*(cols+1)+x;
        const f2=f1+1;
        const b1=layerSize+f1;
        const b2=layerSize+f2;
        indices.push(f1,b1,b2,f1,b2,f2);
    }

    const geometry=new THREE.BufferGeometry();
    geometry.setAttribute("position",new THREE.Float32BufferAttribute(vertices,3));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();
    storeOriginalGeometry(geometry);

    return geometry;
}

/* GUARDAR POSICIONES ORIGINALES */

function storeOriginalGeometry(geometry){
    const position=geometry.attributes.position;
    geometry.userData.originalPositions=[];

    for(let i=0;i<position.count;i++){
        geometry.userData.originalPositions.push([
            position.getX(i),
            position.getY(i),
            position.getZ(i)
        ]);
    }
}

/* ACTUALIZAR CURVATURA */

function updatePageGeometry(mesh,angle,side){
    const geometry=mesh.geometry;
    const position=geometry.attributes.position;
    const original=geometry.userData.originalPositions;

    if(!original)return;

    const width=HALF_WIDTH;
    const bend=Math.sin(Math.abs(angle));

    for(let i=0;i<position.count;i++){
        const ox=original[i][0];
        const oy=original[i][1];
        const oz=original[i][2];
        const t=ox/width;

        const curve=Math.sin(t*Math.PI)*bend*.55;
        const localAngle=angle*t*.24;

        const x=ox*Math.cos(localAngle)-oz*Math.sin(localAngle);
        const z=ox*Math.sin(localAngle)+oz*Math.cos(localAngle)+curve;

        position.setXYZ(i,x,oy,z);
    }

    position.needsUpdate=true;
    geometry.computeVertexNormals();
}

/* RESETAR GEOMETRIA */

function resetPageGeometry(mesh){
    const geometry=mesh.geometry;
    const position=geometry.attributes.position;
    const original=geometry.userData.originalPositions;

    if(!original)return;

    for(let i=0;i<position.count;i++){
        position.setXYZ(i,original[i][0],original[i][1],original[i][2]);
    }

    position.needsUpdate=true;
    geometry.computeVertexNormals();
}

/* CREAR HOJA */

function createSheet(index){
    const group=new THREE.Group();
    const rightPageNumber=index*2+1;
    const leftPageNumber=index*2+2;

    const rightPage=new THREE.Mesh(
        createPageGeometry(),
        pageMaterials[rightPageNumber-1]
    );

    rightPage.position.set(0,0,0);
    rightPage.rotation.y=0;

    const leftPage=new THREE.Mesh(
        createPageGeometry(),
        pageMaterials[leftPageNumber-1]
    );

    leftPage.position.set(0,0,0);
    leftPage.rotation.y=Math.PI;

    group.add(rightPage,leftPage);
    group.userData.index=index;
    group.userData.rightPage=rightPage;
    group.userData.leftPage=leftPage;

    return group;
}

/* CREAR LAS HOJAS */

const sheets=[];

for(let i=0;i<TOTAL_SHEETS;i++){
    const sheet=createSheet(i);
    sheets.push(sheet);
    readingBook.add(sheet);
}

/* PREPARAR LIBRO */

function resetBook(){
    currentSheet=0;
    pageDragging=false;
    draggedSheet=null;
    dragProgress=0;
    pageAnimating=false;

    sheets.forEach((sheet,index)=>{
        sheet.visible=true;
        sheet.position.set(0,1,0);
        sheet.rotation.set(0,0,0);

        const right=sheet.userData.rightPage;
        const left=sheet.userData.leftPage;

        resetPageGeometry(right);
        resetPageGeometry(left);

        right.position.set(0,0,0);
        left.position.set(0,0,0);
        right.rotation.y=0;
        left.rotation.y=Math.PI;
        left.visible=true;
    });

    updatePageVisibility();
    updatePageCounter();
}

/* VISIBILIDAD Y APILADO */

function updatePageVisibility(){
    sheets.forEach((sheet,index)=>{
        if(index<currentSheet){
            sheet.position.x=-.008*index;
            sheet.position.z=-.006*index;
        }else{
            sheet.position.x=.008*index;
            sheet.position.z=.006*index;
        }
    });
}

/* CONTADOR */

function updatePageCounter(){
    const page=currentSheet+1;
    pageCounter.textContent=String(page).padStart(2,"0")+" / "+String(TOTAL_SHEETS).padStart(2,"0");
}

/* ENCONTRAR HOJA ACTIVA */

function getNextSheet(){
    if(currentSheet>=TOTAL_SHEETS)return null;
    return sheets[currentSheet];
}

/* COMENZAR PASO DE PAGINA */

function startPageDrag(event){
    if(!window.readingMode||pageAnimating||pageDragging)return;

    const rect=renderer.domElement.getBoundingClientRect();
    const x=event.clientX-rect.left;
    const y=event.clientY-rect.top;

    if(y>=rect.height*.38)return;

    const fromRight=x>rect.width*.58;
    const fromLeft=x<rect.width*.42;

    if(!fromRight&&!fromLeft)return;

    if(fromLeft){
        if(currentSheet<=0)return;

        draggedSheet=sheets[currentSheet-1];
        dragStartX=x;
        dragStartY=y;
        pageDragging=true;
        dragProgress=0;
        draggedSheet.renderOrder=100;
        event.preventDefault();
        return;
    }

    if(currentSheet>=TOTAL_SHEETS-1)return;

    draggedSheet=sheets[currentSheet];
    dragStartX=x;
    dragStartY=y;
    pageDragging=true;
    dragProgress=0;
    draggedSheet.renderOrder=100;
    event.preventDefault();
}

/* ARRASTRAR PAGINA */

function movePageDrag(event){
    if(!pageDragging||!draggedSheet)return;

    const rect=renderer.domElement.getBoundingClientRect();
    const x=event.clientX-rect.left;
    const width=rect.width;
    const direction=dragStartX>width*.5?1:-1;
    const maxMovement=width*.65;

    let movement=(dragStartX-x)*direction;
    movement=Math.max(0,Math.min(maxMovement,movement));
    dragProgress=movement/maxMovement;

    updateDraggedPage(dragProgress,direction);
    event.preventDefault();
}

/* ACTUALIZAR PAGINA DURANTE DRAG */

function updateDraggedPage(progress,direction){
    if(!draggedSheet)return;

    progress=Math.max(0,Math.min(1,progress));

    const angle=progress*Math.PI;
    const right=draggedSheet.userData.rightPage;
    const left=draggedSheet.userData.leftPage;

    if(direction===1){
        right.position.set(0,0,0);
        right.rotation.y=-angle;
        updatePageGeometry(right,angle,1);
    }else{
        if(draggedSheet.userData.index===TOTAL_SHEETS-1)return;

        left.position.set(0,0,0);
        left.rotation.y=Math.PI+angle;
        updatePageGeometry(left,angle,-1);
    }
}

/* SOLTAR PAGINA */

function endPageDrag(){
    if(!pageDragging||!draggedSheet)return;

    const sheet=draggedSheet;
    const progress=dragProgress;
    const direction=dragStartX>renderer.domElement.clientWidth*.5?1:-1;

    pageDragging=false;
    draggedSheet=null;

    animatePage(sheet,direction,progress>.5);
}

/* ANIMACION COMPLETA */

function animatePage(sheet,direction,complete){
    pageAnimating=true;

    const start=dragProgress;
    const target=complete?1:0;
    const duration=complete?460:300;
    const startTime=performance.now();

    function animationFrame(now){
        const elapsed=now-startTime;
        const raw=Math.min(1,elapsed/duration);
        const eased=1-Math.pow(1-raw,3);
        const progress=start+(target-start)*eased;

        draggedSheet=sheet;
        updateDraggedPage(progress,direction);

        if(raw<1){
            requestAnimationFrame(animationFrame);
            return;
        }

        draggedSheet=sheet;
        updateDraggedPage(target,direction);
        draggedSheet=null;

        if(complete&&direction===1){
            currentSheet=Math.min(TOTAL_SHEETS-1,currentSheet+1);
        }

        if(complete&&direction===-1){
            currentSheet=Math.max(0,currentSheet-1);
        }

        resetAfterTurn();
    }

    requestAnimationFrame(animationFrame);
}

/* RESTAURAR DESPUES DEL GIRO */

function resetAfterTurn(){
    sheets.forEach((sheet,index)=>{
        sheet.renderOrder=0;

        const right=sheet.userData.rightPage;
        const left=sheet.userData.leftPage;

        resetPageGeometry(right);
        resetPageGeometry(left);

        right.position.set(0,0,0);
        left.position.set(0,0,0);

        if(index<currentSheet){
            right.rotation.y=-Math.PI;
            left.rotation.y=Math.PI;
        }else{
            right.rotation.y=0;
            left.rotation.y=Math.PI;
        }

        left.visible=true;
    });

    updatePageVisibility();
    updatePageCounter();
    pageAnimating=false;
}

/* EVENTOS DEL LIBRO */

renderer.domElement.addEventListener("pointerdown",startPageDrag);
window.addEventListener("pointermove",movePageDrag);
window.addEventListener("pointerup",endPageDrag);

/* ABRIR LIBRO */

openBookButton.addEventListener("click",()=>{
    if(window.readingMode)return;

    window.readingMode=true;

    if(window.model){
        window.model.visible=false;
    }

    document.querySelector(".axis-gizmo").style.display="none";
    document.querySelector(".model-label").style.display="none";
    document.querySelector(".rotate-label").style.display="none";
    document.querySelector(".buy-button").style.display="none";

    openBookButton.style.display="none";
    exitReadingButton.style.display="flex";
    readingUI.style.display="block";
    readingBook.visible=true;

    resetBook();
});

/* SALIR DE LECTURA */

exitReadingButton.addEventListener("click",()=>{
    window.readingMode=false;
    readingBook.visible=false;

    if(window.model){
        window.model.visible=true;
    }

    document.querySelector(".axis-gizmo").style.display="block";
    document.querySelector(".model-label").style.display="block";
    document.querySelector(".rotate-label").style.display="block";
    document.querySelector(".buy-button").style.display="inline-flex";

    exitReadingButton.style.display="none";
    openBookButton.style.display="flex";
    readingUI.style.display="none";
});

/* BOTON OPEN BOOK */

openBookButton.style.display="flex";
exitReadingButton.style.display="none";

/* GIZMO ORIGINAL */

function updateAxisGizmo(){
    if(!window.model)return;

    const axes={
        x:new THREE.Vector3(1,0,0),
        y:new THREE.Vector3(0,1,0),
        z:new THREE.Vector3(0,0,1)
    };

    const quaternion=window.model.quaternion;

    axes.x.applyQuaternion(quaternion);
    axes.y.applyQuaternion(quaternion);
    axes.z.applyQuaternion(quaternion);

    function getAngle(vector){
        return Math.atan2(vector.y,vector.x)*180/Math.PI;
    }

    axisX.style.transform=`rotate(${getAngle(axes.x)}deg)`;
    axisY.style.transform=`rotate(${getAngle(axes.y)}deg)`;
    axisZ.style.transform=`rotate(${getAngle(axes.z)}deg)`;
}

/* RESIZE */

window.addEventListener("resize",()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});

/* ANIMACION */

function animate(){
    requestAnimationFrame(animate);
    updateAxisGizmo();
    renderer.render(scene,camera);
}

animate();
</script>

<script>
document.addEventListener("wheel",e=>{
    if(e.ctrlKey)e.preventDefault();
},{passive:false});

document.addEventListener("keydown",e=>{
    if(e.ctrlKey&&["+","-","=","0"].includes(e.key)){
        e.preventDefault();
    }
});
</script>
