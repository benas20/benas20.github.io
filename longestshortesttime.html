*{

}

html,body{

#scene{

.overlay{
    position:fixed;

.system-header{
    position:absolute;

.axis-gizmo{

.axis-center{
    position:absolute;

.axis-line{

    mix-blend-mode:screen;
}

<script type="importmap">
{
    "imports":{
        "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">

import * as THREE from "three";
import {FBXLoader} from "three/addons/loaders/FBXLoader.js";


/* =====================================================
   ELEMENTOS
===================================================== */

const container=document.getElementById("scene");

const axisX=document.querySelector(".axis-x");
const axisY=document.querySelector(".axis-y");
const axisZ=document.querySelector(".axis-z");

const readButton=document.getElementById("readButton");
const exitReading=document.getElementById("exitReading");


/* =====================================================
   THREE.JS
===================================================== */

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
    45,
    window.innerWidth/window.innerHeight,
    .1,
    1000
);

camera.position.set(0,1.2,11);


const renderer=new THREE.WebGLRenderer({
    antialias:true,
    alpha:true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace=THREE.SRGBColorSpace;

container.appendChild(renderer.domElement);


/* =====================================================
   LUCES
===================================================== */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        2
    )
);

const keyLight=new THREE.DirectionalLight(
    0xffffff,
    3
);

keyLight.position.set(
    4,
    6,
    5
);

scene.add(keyLight);


const fillLight=new THREE.DirectionalLight(
    0x9fa99b,
    1.5
);

fillLight.position.set(
    -4,
    2,
    -3
);

scene.add(fillLight);


/* =====================================================
   LIBRO 3D CERRADO
===================================================== */

const loader=new FBXLoader();

let bookModel=null;

loader.load(
    "models/book.fbx",

    object=>{

        object.traverse(child=>{

            if(child.isMesh){

                child.castShadow=true;
                child.receiveShadow=true;

            }

        });


        const box=new THREE.Box3()
            .setFromObject(object);


        const center=box.getCenter(
            new THREE.Vector3()
        );


        const size=box.getSize(
            new THREE.Vector3()
        );


        object.position.sub(center);

        object.position.y+=1;


        const maxSize=Math.max(
            size.x,
            size.y,
            size.z
        );


        const scale=3/maxSize;

        object.scale.setScalar(scale);


        scene.add(object);

        bookModel=object;

        window.model=object;

    },

    undefined,

    error=>{

        console.error(
            "Error cargando FBX:",
            error
        );

    }
);


/* =====================================================
   SISTEMA DE PÁGINAS
===================================================== */

const pageGroup=new THREE.Group();

pageGroup.visible=false;

scene.add(pageGroup);


/*
   DIMENSIONES DEL LIBRO

   Las páginas forman una doble página
   abierta delante del lector.
*/

const pageWidth=2.7;
const pageHeight=3.7;

const pageThickness=.018;

const pageY=1;


/* =====================================================
   TEXTURAS
===================================================== */

const textureLoader=new THREE.TextureLoader();

function loadPageTexture(number){

    const texture=textureLoader.load(
        `img/book/page${number}.jpg`
    );

    texture.colorSpace=THREE.SRGBColorSpace;

    texture.anisotropy=
        renderer.capabilities.getMaxAnisotropy();

    return texture;
}


/* =====================================================
   CREAR UNA HOJA
===================================================== */

function createSheet(
    frontNumber,
    backNumber,
    index
){

    const sheet=new THREE.Group();

    /*
       Cada hoja tiene el eje de giro
       en el centro del libro.
    */

    sheet.position.x=0;
    sheet.position.y=pageY;
    sheet.position.z=index*pageThickness;


    /*
       CARA DELANTERA
    */

    const frontTexture=
        loadPageTexture(frontNumber);

    const frontMaterial=
        new THREE.MeshBasicMaterial({
            map:frontTexture,
            side:THREE.FrontSide
        });


    const frontGeometry=
        new THREE.PlaneGeometry(
            pageWidth,
            pageHeight
        );


    const frontPage=
        new THREE.Mesh(
            frontGeometry,
            frontMaterial
        );


    /*
       El punto de giro está en el borde
       izquierdo de la página.
    */

    frontPage.position.x=
        pageWidth/2;

    frontPage.position.z=
        pageThickness/2;


    /*
       CARA TRASERA
    */

    const backTexture=
        loadPageTexture(backNumber);

    const backMaterial=
        new THREE.MeshBasicMaterial({
            map:backTexture,
            side:THREE.FrontSide
        });


    const backGeometry=
        new THREE.PlaneGeometry(
            pageWidth,
            pageHeight
        );


    const backPage=
        new THREE.Mesh(
            backGeometry,
            backMaterial
        );


    /*
       La cara trasera mira en dirección opuesta.
    */

    backPage.rotation.y=Math.PI;

    backPage.position.x=
        pageWidth/2;

    backPage.position.z=
        -pageThickness/2;


    sheet.add(
        frontPage,
        backPage
    );


    sheet.userData={
        index:index,
        flipped:false,
        frontNumber:frontNumber,
        backNumber:backNumber
    };


    pageGroup.add(sheet);

    return sheet;
}


/* =====================================================
   CREAR LAS 5 HOJAS
===================================================== */

/*
   Hoja 1:
   página 1 / página 2

   Hoja 2:
   página 3 / página 4

   ...

   Hoja 5:
   página 9 / página 10
*/

const sheets=[];

for(let i=0;i<5;i++){

    const front=i*2+1;
    const back=i*2+2;

    const sheet=createSheet(
        front,
        back,
        i
    );

    sheets.push(sheet);
}


/* =====================================================
   POSICIÓN INICIAL
===================================================== */

function resetPages(){

    sheets.forEach((sheet,index)=>{

        sheet.rotation.y=0;

        sheet.userData.flipped=false;

        sheet.position.x=0;
        sheet.position.z=
            index*pageThickness;

    });

}


/* =====================================================
   PASAR UNA PÁGINA
===================================================== */

let currentPage=0;

function flipNext(){

    if(currentPage>=sheets.length)
        return;


    const sheet=
        sheets[currentPage];


    sheet.userData.flipped=true;


    /*
       Giramos la hoja 180º alrededor
       del lomo.
    */

    sheet.rotation.y=-Math.PI;


    currentPage++;

}


function flipPrevious(){

    if(currentPage<=0)
        return;


    currentPage--;

    const sheet=
        sheets[currentPage];


    sheet.userData.flipped=false;

    sheet.rotation.y=0;

}


/* =====================================================
   DRAG DESDE LAS ESQUINAS
===================================================== */

let pageDragging=false;

let dragStartX=0;
let dragStartY=0;

let dragDirection=null;

const cornerSize=180;


container.addEventListener(
    "pointerdown",
    e=>{

        if(!document.body.classList.contains("reading"))
            return;


        const x=e.clientX;
        const y=e.clientY;


        const width=window.innerWidth;


        /*
           Solo permitimos comenzar
           desde las esquinas superiores.
        */

        const leftCorner=
            x<cornerSize &&
            y<cornerSize;


        const rightCorner=
            x>width-cornerSize &&
            y<cornerSize;


        if(!leftCorner && !rightCorner)
            return;


        pageDragging=true;

        dragStartX=x;
        dragStartY=y;


        if(rightCorner){

            dragDirection="next";

        }else{

            dragDirection="previous";

        }


        container.setPointerCapture(
            e.pointerId
        );

    }
);


/* =====================================================
   ARRASTRAR PÁGINA
===================================================== */

container.addEventListener(
    "pointermove",
    e=>{

        if(!pageDragging)
            return;


        const dx=
            e.clientX-dragStartX;


        let progress=
            Math.abs(dx)/window.innerWidth;


        progress=
            Math.min(1,progress);


        /*
           Página actual que se está arrastrando.
        */

        if(
            dragDirection==="next" &&
            currentPage<sheets.length
        ){

            const sheet=
                sheets[currentPage];


            sheet.rotation.y=
                -Math.PI*progress;

        }


        if(
            dragDirection==="previous" &&
            currentPage>0
        ){

            const sheet=
                sheets[currentPage-1];


            sheet.rotation.y=
                -Math.PI+
                Math.PI*progress;

        }

    }
);


/* =====================================================
   SOLTAR PÁGINA
===================================================== */

container.addEventListener(
    "pointerup",
    e=>{

        if(!pageDragging)
            return;


        pageDragging=false;


        const dx=
            e.clientX-dragStartX;


        const threshold=
            window.innerWidth*.20;


        if(
            dragDirection==="next" &&
            dx<-threshold
        ){

            flipNext();

        }

        else if(
            dragDirection==="previous" &&
            dx>threshold
        ){

            flipPrevious();

        }

        else{

            /*
               Si no se ha arrastrado suficiente,
               devolvemos la hoja a su posición.
            */

            if(
                dragDirection==="next" &&
                currentPage<sheets.length
            ){

                sheets[currentPage]
                    .rotation.y=0;

            }


            if(
                dragDirection==="previous" &&
                currentPage>0
            ){

                sheets[currentPage-1]
                    .rotation.y=-Math.PI;

            }

        }


        dragDirection=null;

    }
);


/* =====================================================
   ENTRAR EN LECTURA
===================================================== */

readButton.addEventListener(
    "click",
    ()=>{

        document.body.classList.add(
            "reading"
        );


        /*
           Ocultamos el modelo cerrado.
        */

        if(bookModel)
            bookModel.visible=false;


        /*
           Mostramos las páginas.
        */

        pageGroup.visible=true;


        /*
           Colocamos el libro de frente.
        */

        pageGroup.rotation.set(
            0,
            0,
            0
        );


        pageGroup.position.set(
            0,
            0,
            0
        );


        /*
           Comenzamos desde la portada.
        */

        currentPage=0;

        resetPages();

    }
);


/* =====================================================
   SALIR DE LECTURA
===================================================== */

exitReading.addEventListener(
    "click",
    ()=>{

        document.body.classList.remove(
            "reading"
        );


        pageGroup.visible=false;


        if(bookModel)
            bookModel.visible=true;

    }
);


/* =====================================================
   ROTACIÓN DEL MODELO CERRADO
===================================================== */

let dragging=false;

let previousX=0;
let previousY=0;


container.addEventListener(
    "pointerdown",
    e=>{

        if(
            document.body.classList.contains(
                "reading"
            )
        )
            return;


        dragging=true;

        previousX=e.clientX;
        previousY=e.clientY;

    }
);


window.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
    }
);


window.addEventListener(
    "pointermove",
    e=>{

        if(
            !dragging ||
            !window.model ||
            document.body.classList.contains(
                "reading"
            )
        )
            return;


        const dx=
            e.clientX-previousX;

        const dy=
            e.clientY-previousY;


        window.model.rotation.y+=
            dx*.01;

        window.model.rotation.x+=
            dy*.01;


        previousX=e.clientX;
        previousY=e.clientY;

    }
);


/* =====================================================
   ZOOM DEL MODELO
===================================================== */

window.addEventListener(
    "wheel",
    e=>{

        if(
            document.body.classList.contains(
                "reading"
            )
        )
            return;


        camera.position.z+=
            e.deltaY*.003;


        camera.position.z=
            Math.max(
                7,
                Math.min(
                    10,
                    camera.position.z
                )
            );

    }
);


/* =====================================================
   AXIS GIZMO
===================================================== */

function updateAxisGizmo(){

    if(
        !window.model ||
        document.body.classList.contains(
            "reading"
        )
    )
        return;


    const axes={

        x:new THREE.Vector3(1,0,0),
        y:new THREE.Vector3(0,1,0),
        z:new THREE.Vector3(0,0,1)

    };


    const quaternion=
        window.model.quaternion;


    axes.x.applyQuaternion(quaternion);
    axes.y.applyQuaternion(quaternion);
    axes.z.applyQuaternion(quaternion);


    function getAngle(vector){

        return Math.atan2(
            vector.y,
            vector.x
        )*180/Math.PI;

    }


    axisX.style.transform=
        `rotate(${getAngle(axes.x)}deg)`;

    axisY.style.transform=
        `rotate(${getAngle(axes.y)}deg)`;

    axisZ.style.transform=
        `rotate(${getAngle(axes.z)}deg)`;

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            window.innerWidth/
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   ANIMACIÓN
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    updateAxisGizmo();


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>


<script>

/* =====================================================
   BLOQUEAR ZOOM DEL NAVEGADOR

document.addEventListener(
    "wheel",
    e=>{

        if(e.ctrlKey){

            e.preventDefault();

        }

    },
    {passive:false}
);


document.addEventListener(
    "keydown",
    e=>{

        if(
            e.ctrlKey &&
            ["+","-","=","0"].includes(e.key)
        ){

            e.preventDefault();

        }

    }
);

</script>
