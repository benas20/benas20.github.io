<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHOTOBOOK</title>
<link rel="icon" href="data:,">

<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;caret-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1f1d17;color:#d8cfae;font-family:"Courier New",monospace}

#background{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
    filter:saturate(.75) contrast(.95);
}

#scene{
    position:fixed;
    inset:0;
    z-index:2;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
}

.system-header{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:34px;
    padding:0 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#d8cfae;
    font-size:11px;
    letter-spacing:2px;
    border-bottom:1px solid #d8cfae33;
    background:#1f1d1780;
    backdrop-filter:blur(5px);
}

.model-label{
    position:absolute;
    left:28px;
    bottom:30px;
    font-size:9px;
    letter-spacing:2px;
}

.rotate-label{
    position:absolute;
    right:28px;
    bottom:30px;
    font-size:9px;
    letter-spacing:2px;
}

.back{
    position:absolute;
    left:28px;
    top:55px;
    color:#d8cfae;
    text-decoration:none;
    font-size:7px;
    letter-spacing:2px;
    pointer-events:auto;
}

.grain{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
    opacity:.08;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
    mix-blend-mode:screen;
}
</style>
</head>

<body>

<video id="background" autoplay muted loop playsinline>
    <source src="videos/sphereroom.mp4" type="video/mp4">
</video>

<div id="scene"></div>

<div class="overlay">
    <div class="system-header">
        <span>SYSTEM PROYECT 02</span>
        <span>VISUAL ARCHIVE</span>
        <span>● ONLINE</span>
    </div>

    <a class="back" href="index.html">← BACK TO INDEX</a>

    <div class="model-label">
        FILE 001 / BOOK 3D MODEL
    </div>

    <div class="rotate-label">
        DRAG TO ROTATE · SCROLL TO ZOOM
    </div>
</div>

<div class="grain"></div>

<script type="importmap">
{
    "imports":{
        "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from "three";
import {FBXLoader} from "three/addons/loaders/FBXLoader.js";

const container=document.getElementById("scene");

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
    45,
    window.innerWidth/window.innerHeight,
    .1,
    1000
);

camera.position.set(0,1.2,6);

const renderer=new THREE.WebGLRenderer({
    antialias:true,
    alpha:true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);


/* ILUMINACIÓN */

scene.add(new THREE.AmbientLight(0xffffff,2));

const keyLight=new THREE.DirectionalLight(0xffffff,3);
keyLight.position.set(4,6,5);
scene.add(keyLight);

const fillLight=new THREE.DirectionalLight(0x9fa99b,1.5);
fillLight.position.set(-4,2,-3);
scene.add(fillLight);


/* MODELO */

const loader=new FBXLoader();

loader.load(
    "models/book.fbx",
    object=>{

        object.traverse(child=>{
            if(child.isMesh){
                child.castShadow=true;
                child.receiveShadow=true;
            }
        });

        const box=new THREE.Box3().setFromObject(object);
        const center=box.getCenter(new THREE.Vector3());
        const size=box.getSize(new THREE.Vector3());

        object.position.sub(center);
        object.position.y+=0.35;

        const maxSize=Math.max(size.x,size.y,size.z);
        const scale=3/maxSize;

        object.scale.setScalar(scale);

        scene.add(object);

        window.model=object;
    },
    undefined,
    error=>{
        console.error("Error cargando FBX:",error);
    }
);


/* ROTACIÓN */

let dragging=false;
let previousX=0;
let previousY=0;

container.addEventListener("pointerdown",e=>{
    dragging=true;
    previousX=e.clientX;
    previousY=e.clientY;
});

window.addEventListener("pointerup",()=>{
    dragging=false;
});

window.addEventListener("pointermove",e=>{
    if(!dragging||!window.model)return;

    const dx=e.clientX-previousX;
    const dy=e.clientY-previousY;

    window.model.rotation.y+=dx*.01;
    window.model.rotation.x+=dy*.01;

    previousX=e.clientX;
    previousY=e.clientY;
});


/* ZOOM */

window.addEventListener("wheel",e=>{
    camera.position.z+=e.deltaY*.003;
    camera.position.z=Math.max(2.5,Math.min(10,camera.position.z));
});


/* RESIZE */

window.addEventListener("resize",()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});


/* RENDER */

function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene,camera);
}

animate();
</script>

</body>
</html>
